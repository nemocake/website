  <style>
    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #ccff00; }

    /* Scanlines overlay */
    .scanlines {
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
      background-size: 100% 4px;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.6;
    }

    /* Noise overlay */
    .noise {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Selection */
    ::selection { background: #ccff00; color: #000; }

    /* Glass panel */
    .glass-panel {
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    /* Project card reveal animation */
    .project-card {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .project-card.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Intro reveal */
    .projects-intro {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .projects-intro.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Nav link active state */
    .nav-link-item.is-active {
      color: var(--sanguine);
      border-left-color: var(--sanguine);
    }
  </style>

  <style>
    /* ==================================================================
       CLEAN PASS — ABC Areal only, pure white or dark, no frames or rules.
       Same tokens as the home + collection pages; page-local until shell/retint follow.
       ================================================================== */
    @font-face { font-family: "Areal"; src: url("../assets/catalogue/fonts/ABCAreal-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Areal"; src: url("../assets/catalogue/fonts/ABCAreal-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
    @font-face { font-family: "Areal"; src: url("../assets/catalogue/fonts/ABCAreal-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

    :root, :root[data-theme="white"], :root[data-theme="cream"] {
      --paper-rgb: 255, 255, 255; --paper-deep: #ffffff;
      --ink-rgb: 17, 17, 17; --ink-soft: #3a3a3a; --ink-faint: #8c8c8c;
      --rule: rgba(var(--ink-rgb), .14);
      --sanguine: rgb(var(--ink-rgb)); --sang-rgb: var(--ink-rgb);          /* one accent: the ink itself */
      --font-display: "Areal", sans-serif; --font-text: "Areal", sans-serif; --font-mono: "Areal", sans-serif;
    }
    :root[data-theme="dark"] {
      --paper-rgb: 14, 14, 14; --paper-deep: #0e0e0e;
      --ink-rgb: 237, 237, 237; --ink-soft: #bdbdbd; --ink-faint: #7a7a7a;
      --sanguine: rgb(var(--ink-rgb)); --sang-rgb: var(--ink-rgb);
    }
    body { font-size: 14px; }
    body::after { display: none !important; }                 /* no paper grain */
    ::selection { background: rgb(var(--ink-rgb)); color: rgb(var(--paper-rgb)); }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-faint) !important; }

    /* type: Medium for names, Regular for the rest; no wide tracking, no shouting, no italics */
    .font-mono, .font-sans { letter-spacing: .005em !important; }
    .font-display { font-weight: 500 !important; letter-spacing: -.035em !important; }
    .tracking-widest, .uppercase { letter-spacing: .005em !important; }
    .uppercase { text-transform: none !important; }
    .italic { font-style: normal !important; }
    .text-xs, .text-\[10px\] { font-size: 12px !important; line-height: 1.45 !important; }

    /* hard corners, no frames, no rules, no shadows — whitespace separates */
    *, *::before, *::after { border-radius: 0 !important; }
    [class*="border"] { border-color: transparent !important; }
    .glass-panel { background: transparent !important; border: 0 !important; box-shadow: none !important; }
    [class*="shadow"] { box-shadow: none !important; }
    .backdrop-blur, .backdrop-blur-sm, .backdrop-blur-md { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }

    /* top nav: plain row, no bar, no rule */
    header.mix-blend-difference { border-bottom: 0 !important; background: rgb(var(--paper-rgb)) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
    .site-home { font: 500 14px/1 var(--font-display) !important; letter-spacing: -.035em !important; color: var(--ink) !important; }
    .site-links { font-size: 12px !important; letter-spacing: .005em !important; }
    .site-links a.cur, .site-links a:hover { color: var(--ink) !important; }

    /* sidebar: a plain list of names, the one in view in ink */
    aside .glass-panel { padding: 0 !important; }
    aside h2 { font-size: 20px !important; color: var(--ink) !important; }
    /* the marker hangs in the gutter: 12px clear of the text, names stay aligned with the heading */
    .nav-link-item { padding: 5px 0 5px 12px !important; margin-left: -14px !important;
                     border-left: 2px solid transparent !important; font-size: 13px !important; color: var(--ink-faint) !important; }
    .nav-link-item:hover { color: var(--ink) !important; border-left-color: var(--ink-faint) !important; }
    .nav-link-item.is-active { color: var(--ink) !important; border-left-color: var(--ink) !important; }

    /* project entries: no card, whitespace between them */
    #projects-grid { display: flex; flex-direction: column; gap: 72px; }
    #projects-grid > * + * { margin-top: 0 !important; }
    .project-card { padding: 0 !important; }
    .project-card h2 { font-size: clamp(26px, 3.2vw, 36px) !important; line-height: 1.05 !important; color: var(--ink) !important; }
    .pj-status { font-size: 12px; color: var(--ink-faint); margin-bottom: 10px; }
    .pj-blurb { font-size: 15px; line-height: 1.5; color: var(--ink-soft); margin-bottom: 18px; }
    .pj-details { font-size: 14px; line-height: 1.6; color: var(--ink-soft); max-width: 62ch; }
    .pj-details a { color: var(--ink) !important; text-decoration: underline; text-underline-offset: 2px; }
    .pj-links { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 22px; font-size: 13px; }
    .pj-links a { color: var(--ink) !important; text-decoration: underline; text-underline-offset: 3px; }
    .pj-links a:hover { text-decoration-thickness: 2px; }
    .pj-foot { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; font-size: 12px; color: var(--ink-faint); }
    .pj-foot a { color: var(--ink-faint) !important; margin-left: auto; }
    .pj-foot a:hover { color: var(--ink) !important; }
    .pj-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 22px; }
    .pj-imgs img { width: 100%; }
    .pj-empty { font-size: 13px; color: var(--ink-faint); }

    /* intro line */
    main .text-gray-400 { color: var(--ink-soft) !important; }

    /* footer: no bar; light / dark sits with the links */
    footer { background: transparent !important; }
    footer .text-gray-500 { color: var(--ink-faint) !important; }
    .theme-toggle { display: inline-flex; gap: 12px; }
    .theme-toggle button { all: unset; cursor: pointer; font: 400 12px var(--font-mono); color: var(--ink-faint); }
    .theme-toggle button:hover, .theme-toggle button.cur { color: var(--ink); }
  </style>

  <!-- JavaScript -->
  <script>
    // Current year
    document.getElementById('current-year').textContent = new Date().getFullYear();

    (function() {
      const GITHUB_USERNAME = 'nemocake';

      // Format date helper
      function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
      }

      // Merge GitHub data with config overrides + add private projects
      function mergeWithConfig(repos, projectsConfig) {
        // names rendered as curated (config-only) cards — skip the fetched repo so it isn't listed twice
        const curatedNames = new Set(Object.entries(projectsConfig || {}).filter(([k, c]) => c.private === true).map(([k]) => k));
        // Map GitHub repos with config overrides
        const githubProjects = repos.filter(repo => !curatedNames.has(repo.name)).map(repo => {
          const config = projectsConfig?.[repo.name] || {};
          return {
            ...repo,
            isPrivate: false,
            customDescription: config.description,
            customTitle: config.title,
            details: config.details || [],
            images: config.images || [],
            tags: config.tags || [],
            status: config.status,
            status2: config.status2,
            featured: config.featured || false,
            liveUrl: config.liveUrl,
            articleUrl: config.articleUrl
          };
        });

        // Add private/config-only projects
        const privateProjects = Object.entries(projectsConfig || {})
          .filter(([key, config]) => config.private === true)
          .map(([key, config]) => ({
            name: key,
            isPrivate: true,
            customTitle: config.title || key,
            customDescription: config.description || '',
            description: config.description || '',
            details: config.details || [],
            images: config.images || [],
            tags: config.tags || [],
            status: config.status,
            status2: config.status2,
            featured: config.featured || false,
            liveUrl: config.liveUrl,
            repoUrl: config.repoUrl,
            articleUrl: config.articleUrl,
            updated_at: new Date().toISOString() // Use current date for private projects
          }));

        // Combine and sort
        return [...githubProjects, ...privateProjects].sort((a, b) => {
          // Featured projects first
          if (a.featured && !b.featured) return -1;
          if (!a.featured && b.featured) return 1;
          // Then by update date
          return new Date(b.updated_at) - new Date(a.updated_at);
        });
      }

      // Function to render projects
      function renderProjects(repos) {
        if (!repos || repos.length === 0) {
          document.getElementById('projects-grid').innerHTML = '<p class="pj-empty">nothing to show yet.</p>';
          return;
        }

        // Render navigation
        const navList = document.getElementById('projects-nav-list');
        navList.innerHTML = repos.map((repo, index) => {
          const displayName = repo.customTitle || repo.name;
          return `
            <li>
              <a href="#${repo.name}" class="nav-link-item block ${index === 0 ? 'is-active' : ''}">${displayName}</a>
            </li>
          `;
        }).join('');

        // Render project cards
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = repos.map((repo, index) => {
          const displayTitle = repo.customTitle || repo.name;
          const description = repo.customDescription || repo.description || 'no description provided.';

          // tags are plain faint words, like the home project preview
          const tagList = repo.isPrivate ? (repo.tags || []) : (repo.language ? [repo.language] : []);
          const tagsHtml = tagList.map(t => `<span>${t}</span>`).join('');

          const detailsHtml = repo.details.length > 0
            ? `<div class="pj-details mb-6">${repo.details.map(p => `<p class="mb-4 last:mb-0">${p}</p>`).join('')}</div>`
            : '';
          const imagesHtml = repo.images.length > 0
            ? `<div class="pj-imgs">${repo.images.map(img => `<img src="${img}" alt="${repo.name} screenshot">`).join('')}</div>`
            : '';

          // status, lowercase and quiet (no "private"/"repo"/"featured" badges, no numbering, no star/fork counts)
          const status = [repo.status, repo.status2].filter(Boolean).map(x => String(x).toLowerCase()).join(' · ');

          const cloneHref = repo.isPrivate ? repo.repoUrl : repo.html_url;
          const liveHref = repo.liveUrl || (repo.isPrivate ? null : repo.homepage);
          const primaryLinks = [
            liveHref ? `<a href="${liveHref}" target="_blank" rel="noopener">open it live &nearr;</a>` : '',
            repo.articleUrl ? `<a href="${repo.articleUrl}">read the writing &rarr;</a>` : ''
          ].filter(Boolean).join('');

          return `
            <article class="project-card" id="${repo.name}">
              ${status ? `<div class="pj-status">${status}</div>` : ''}
              <h2 class="font-display mb-3">${displayTitle}</h2>
              <p class="pj-blurb">${description}</p>
              ${primaryLinks ? `<div class="pj-links">${primaryLinks}</div>` : ''}
              ${detailsHtml}
              ${imagesHtml}
              ${(tagsHtml || cloneHref) ? `<div class="pj-foot">${tagsHtml}${cloneHref ? `<a href="${cloneHref}" target="_blank" rel="noopener">code &nearr;</a>` : ''}</div>` : ''}
            </article>
          `;
        }).join('');

        // Init scroll effects after render
        initScrollEffects();

        // Handle hash navigation
        if (window.location.hash) {
          setTimeout(() => {
            const targetId = window.location.hash.substring(1);
            const target = document.getElementById(targetId);
            if (target) {
              const headerOffset = 120;
              const elementPosition = target.getBoundingClientRect().top;
              const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
              window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
            }
          }, 200);
        }
      }

      function initScrollEffects() {
        const navLinks = document.querySelectorAll('.nav-link-item');
        const sections = document.querySelectorAll('.project-card');
        const intro = document.querySelector('.projects-intro');

        // Reveal on scroll using Intersection Observer
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
            }
          });
        }, {
          threshold: 0.1,
          rootMargin: '0px 0px -10% 0px'
        });

        // Observe intro and sections
        if (intro) revealObserver.observe(intro);
        sections.forEach(section => revealObserver.observe(section));

        // Scroll spy - highlight active nav item
        const spyObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const id = entry.target.getAttribute('id');
              navLinks.forEach(link => {
                link.classList.remove('is-active');
                if (link.getAttribute('href') === `#${id}`) {
                  link.classList.add('is-active');
                }
              });
            }
          });
        }, {
          threshold: 0.3,
          rootMargin: '-20% 0px -60% 0px'
        });

        sections.forEach(section => spyObserver.observe(section));
      }

      // Load projects from GitHub API + merge with config
      async function loadProjects() {
        const grid = document.getElementById('projects-grid');
        grid.innerHTML = '<p class="pj-empty">loading&hellip;</p>';

        try {
          // Wait for config to load first (uses helper from config-loader.js)
          const config = await window.waitForConfig(5000);
          const projectsConfig = config?.projects || {};

          console.log('[Projects] Config loaded, projects config keys:', Object.keys(projectsConfig));

          // Fetch GitHub repos
          const response = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=20`);
          if (!response.ok) throw new Error('Failed to fetch');

          const repos = await response.json();

          // Filter out forked repos
          const sourceRepos = repos.filter(repo => !repo.fork);

          // Merge GitHub data with config overrides
          const mergedProjects = mergeWithConfig(sourceRepos, projectsConfig);

          console.log('[Projects] Loaded', mergedProjects.length, 'projects (GitHub + private)');
          renderProjects(mergedProjects);

        } catch (error) {
          console.error('[Projects] Failed to load from GitHub:', error);
          grid.innerHTML = '<p class="pj-empty">couldn&rsquo;t reach github just now.</p>';
        }
      }

      loadProjects();
    })();
  </script>

  <script>
  /* light / dark — writes the shared key only when the visitor actually picks one */
  (function () {
    var KEY = "studio.theme";
    function mark() {
      var t = document.documentElement.dataset.theme;
      document.querySelectorAll(".theme-toggle button").forEach(function (b) { b.classList.toggle("cur", b.dataset.t === t); });
    }
    document.querySelector(".theme-toggle").addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      document.documentElement.dataset.theme = b.dataset.t;
      try { localStorage.setItem(KEY, b.dataset.t); } catch (_) {}
      mark();
    });
    mark();
  })();
  </script>
