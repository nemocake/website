<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>con.rad — the notebook</title>
<script>try{var t=localStorage.getItem("studio.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="../assets/catalogue/shell.css" />
<script src="../assets/catalogue/graphite.js" defer></script>
<script src="../assets/catalogue/theme.js" defer></script>
<script src="../assets/catalogue/masthead.js" defer></script>
<script src="_home-data.js"></script>
<style>
  /* ---- header tuning (KEEP AS-IS) ---- */
  #cover { padding-top: clamp(18px, 4vh, 40px); }
  #cover .over.over-mark { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  #cover .over-mark .wordmark { justify-self: start; }
  #cover .over-mark .est { justify-self: end; }
  #cover .corner-logo { justify-self: center; width: clamp(150px, 20vw, 220px); }
  #cover .corner-logo .drawn-title { display: flex; justify-content: center; }
  #cover .corner-logo canvas { max-height: 50px; }
  #cover .cover-intro { margin-top: 22px; font-style: italic; text-align: center; max-width: none; }
  @media (max-width: 640px) {
    #cover .over.over-mark { grid-template-columns: 1fr; justify-items: center; gap: 6px; }
    #cover .over-mark .wordmark, #cover .over-mark .est { justify-self: center; }
  }

  /* ==================================================================
     THE NOTEBOOK — spotlight + quiet directory + living are.na feed
     ================================================================== */
  #home-body { display: block; margin-top: 40px; }

  /* ---------- 1 · SPOTLIGHT ---------- */
  .spot {
    position: relative;
    border: 1px solid var(--ink);
    background: var(--paper-deep);
    padding: 0;
    overflow: hidden;
  }
  .spot-rail {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 11px clamp(16px, 2vw, 26px);
    border-bottom: 1px solid var(--rule);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em;
    text-transform: lowercase; color: var(--ink-faint);
  }
  .spot-rail .sr-r { color: var(--sanguine); }

  .spot-stage { position: relative; display: grid; }
  .slide {
    grid-area: 1 / 1;
    display: grid;
    opacity: 0; visibility: hidden;
    transition: opacity .8s ease, visibility 0s linear .8s;
    pointer-events: none;
  }
  .slide.is-on { opacity: 1; visibility: visible; transition: opacity .8s ease; pointer-events: auto; }

  /* artwork slide: image | text */
  .slide-art { grid-template-columns: 1.06fr 1fr; min-height: clamp(320px, 42vw, 480px); }
  .slide-art .s-img {
    position: relative; overflow: hidden; background: var(--paper);
    border-right: 1px solid var(--rule); display: block;
  }
  .slide-art .s-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide-art .s-img::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(var(--ink-rgb), .04);
  }

  .s-body {
    padding: clamp(24px, 3vw, 52px);
    display: flex; flex-direction: column; justify-content: center; gap: 14px;
    min-width: 0;
  }
  .s-kicker {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .26em;
    text-transform: lowercase; color: var(--sanguine);
  }
  .s-title {
    font-family: var(--font-display); font-weight: 400; line-height: .98;
    font-size: clamp(34px, 4.4vw, 60px); margin: 0; letter-spacing: .01em;
  }
  .s-blurb {
    font-family: var(--font-text); font-size: clamp(15px, 1.5vw, 17.5px);
    line-height: 1.6; color: var(--ink-soft); margin: 0; max-width: 46ch;
  }
  .s-link {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em;
    text-transform: lowercase; color: var(--ink); margin-top: 6px;
    border-bottom: 1px solid var(--rule); padding-bottom: 3px; align-self: flex-start;
    transition: color .2s, border-color .2s;
  }
  .s-link:hover { color: var(--sanguine); border-color: var(--sanguine); }

  /* typographic slide (writing / project): big word treatment */
  .slide-type { grid-template-columns: 1fr; min-height: clamp(320px, 42vw, 480px); }
  .slide-type .s-body {
    padding: clamp(30px, 5vw, 74px);
    background:
      linear-gradient(0deg, var(--paper-deep), var(--paper-deep)),
      var(--paper);
  }
  .slide-type .s-title { font-size: clamp(46px, 8vw, 104px); line-height: .92; }
  .slide-type .s-blurb { font-size: clamp(16px, 1.7vw, 20px); font-style: italic; max-width: 40ch; }
  .slide-type .s-mark {
    font-family: var(--font-degraded); font-size: clamp(12px, 1.4vw, 15px);
    color: var(--ink-faint); letter-spacing: .04em; margin-top: 2px;
  }

  /* progress tick + dots */
  .spot-foot {
    position: absolute; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 0 clamp(16px, 2vw, 26px) 0 0;
  }
  .spot-tick { flex: 1; height: 2px; background: var(--rule-faint); position: relative; }
  .spot-tick i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--sanguine); display: block;
  }
  .spot-dots { display: flex; gap: 8px; padding: 12px 0; }
  .spot-dots button {
    width: 8px; height: 8px; padding: 0; border-radius: 50%;
    border: 1px solid var(--ink-faint); background: transparent; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .spot-dots button.cur { background: var(--sanguine); border-color: var(--sanguine); }

  @media (max-width: 720px) {
    .slide-art { grid-template-columns: 1fr; min-height: 0; }
    .slide-art .s-img { aspect-ratio: 3 / 2; border-right: 0; border-bottom: 1px solid var(--rule); }
    .slide-type { min-height: 0; }
    .spot-stage { min-height: 0; }
  }

  /* ---------- 2 · DIRECTORY BAND (quiet wayfinding) ---------- */
  .dir-band {
    display: flex; align-items: stretch; flex-wrap: wrap;
    margin: 30px 0 8px;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule);
  }
  .dir-item {
    flex: 1 1 0; min-width: 150px;
    display: flex; align-items: baseline; gap: 10px;
    padding: 15px clamp(12px, 1.6vw, 22px);
    border-right: 1px solid var(--rule-faint);
  }
  .dir-item:last-child { border-right: 0; }
  .dir-item .dn {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(19px, 2.1vw, 25px); line-height: 1;
  }
  .dir-item .dc {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    color: var(--sanguine); margin-left: auto;
  }
  .dir-item .dd {
    display: block; width: 100%; margin-top: 4px;
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .04em;
    text-transform: lowercase; color: var(--ink-faint);
  }
  .dir-item:hover .dn { color: var(--sanguine); }
  @media (max-width: 640px) {
    .dir-band { border-bottom: 0; }
    .dir-item { flex: 1 1 46%; border-bottom: 1px solid var(--rule-faint); }
    .dir-item:nth-child(2n) { border-right: 0; }
  }

  /* ---------- 3 · LATELY — the feed ---------- */
  .lately { margin-top: 58px; }
  .lately-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px 24px; flex-wrap: wrap;
    border-bottom: 1px solid var(--ink); padding-bottom: 12px;
  }
  .lh-left { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; min-width: 0; }
  .lh-left h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); }
  .lh-sub {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em;
    text-transform: lowercase; color: var(--ink-faint); font-style: normal;
  }
  .lh-live {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    text-transform: lowercase; color: var(--ink-faint); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .lh-live .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--sanguine);
    box-shadow: 0 0 0 0 rgba(var(--sang-rgb), .5); animation: pulse 2.4s ease-out infinite;
  }
  .lh-live.snap .dot { background: var(--ink-faint); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(var(--sang-rgb), .45); }
    70%, 100% { box-shadow: 0 0 0 7px rgba(var(--sang-rgb), 0); }
  }

  .feed { columns: 4 200px; column-gap: 16px; margin-top: 22px; }
  @media (max-width: 900px) { .feed { columns: 3 180px; column-gap: 14px; } }
  @media (max-width: 560px) { .feed { columns: 2 150px; column-gap: 12px; } }

  .fblock {
    display: block; position: relative; break-inside: avoid;
    margin: 0 0 16px; border: 1px solid var(--rule);
    background: var(--paper-deep); overflow: hidden;
  }
  .fblock img {
    width: 100%; height: auto; display: block;
    filter: grayscale(.12) contrast(.98);
    transition: filter .4s ease, transform .5s ease;
  }
  .fblock:hover img { filter: none; transform: scale(1.02); }
  .fmeta {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 22px 11px 9px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    background: linear-gradient(0deg, rgba(var(--ink-rgb), .74), rgba(var(--ink-rgb), 0));
    opacity: 0; transform: translateY(6px);
    transition: opacity .28s ease, transform .28s ease;
  }
  .fblock:hover .fmeta, .fblock:focus-visible .fmeta { opacity: 1; transform: none; }
  .fmeta .ft {
    font-family: var(--font-text); font-size: 12.5px; line-height: 1.25;
    color: rgb(var(--paper-rgb)); min-width: 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .fmeta .fw {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em;
    color: rgba(var(--paper-rgb), .8); white-space: nowrap; flex: none; padding-bottom: 1px;
  }

  /* skeleton loading */
  .fskel { break-inside: avoid; margin: 0 0 16px; border: 1px solid var(--rule-faint); background: var(--paper-deep); }
  .fskel i {
    display: block; width: 100%;
    background: linear-gradient(100deg, var(--paper-deep) 30%, rgba(var(--ink-rgb), .06) 50%, var(--paper-deep) 70%);
    background-size: 220% 100%; animation: shim 1.5s linear infinite;
  }
  @keyframes shim { to { background-position: -220% 0; } }

  .feed-empty {
    margin-top: 26px; font-family: var(--font-mono); font-size: 12px;
    letter-spacing: .06em; color: var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    .slide { transition: opacity .001s; }
    .lh-live .dot, .fskel i { animation: none; }
  }
</style>
</head>
<body class="on-cover">

<div class="wrap">
  <header class="mast" id="cover">
    <div class="over over-mark">
      <span class="wordmark">building curiosity...</span>
      <div class="corner-logo"><h1 data-drawn data-cap="30">con.rad</h1></div>
      <span class="est" title="established 02·04·1998">est. ii·iv·mcmxcviii</span>
    </div>
    <p class="cover-intro">chronically online, techno-curious, art and music junky.</p>
    <hr class="rule" />
  </header>

  <!-- ===== BODY: build your direction here (directory + favourites + are.na feed) ===== -->
  <main id="home-body"></main>

</div>

<footer class="colophon">
  <div class="cols">
    <span>con.rad</span>
    <a href="mailto:conradhouse1998@gmail.com">email</a>
    <a href="https://www.are.na/conrad-house" target="_blank" rel="noopener">are.na</a>
  </div>
  <span>set in happy times &amp; routed gothic</span>
</footer>

<script>
/* THE NOTEBOOK — a living daily page: spotlight, quiet directory, are.na feed */
(function () {
  var H = window.HomeData, esc = H.esc, body = document.getElementById("home-body");

  // shell
  body.innerHTML =
    '<section class="spot" id="spot" aria-label="favourites">' +
      '<div class="spot-rail"><span class="sr-l">the notebook</span><span class="sr-r">favourites</span></div>' +
      '<div class="spot-stage" id="spot-stage"></div>' +
      '<div class="spot-foot"><span class="spot-tick"><i id="spot-tick"></i></span><span class="spot-dots" id="spot-dots"></span></div>' +
    '</section>' +
    '<nav class="dir-band" id="dir-band" aria-label="sections"></nav>' +
    '<section class="lately" id="lately" aria-label="lately">' +
      '<div class="lately-head">' +
        '<div class="lh-left"><h2 data-drawn data-cap="40">lately</h2><span class="lh-sub">what i&#39;m looking at</span></div>' +
        '<span class="lh-live" id="lh-live">connecting to are.na&hellip;</span>' +
      '</div>' +
      '<div class="feed" id="feed"></div>' +
    '</section>';

  /* ---------- 1 · SPOTLIGHT ---------- */
  (function spotlight() {
    var favs = H.FAVORITES || [], stage = document.getElementById("spot-stage"),
        dotsWrap = document.getElementById("spot-dots"), tick = document.getElementById("spot-tick"),
        spot = document.getElementById("spot");
    var linkFor = { artwork: "open the piece", writing: "read the note", project: "see the project" };

    favs.forEach(function (f, i) {
      var a = document.createElement("article");
      var link = '<a class="s-link" href="' + esc(f.href) + '">' + (linkFor[f.type] || "open") + ' &rarr;</a>';
      var kick = '<div class="s-kicker">' + esc(f.kicker || f.type) + '</div>';
      var title = '<h3 class="s-title">' + esc(f.title) + '</h3>';
      var blurb = '<p class="s-blurb">' + esc(f.blurb) + '</p>';
      if (f.img) {
        a.className = "slide slide-art";
        a.innerHTML =
          '<a class="s-img" href="' + esc(f.href) + '" tabindex="-1" aria-hidden="true"><img loading="lazy" alt="" src="' + esc(f.img) + '"></a>' +
          '<div class="s-body">' + kick + title + blurb + link + '</div>';
      } else {
        a.className = "slide slide-type";
        a.innerHTML =
          '<div class="s-body">' + kick + title + blurb +
          '<div class="s-mark">' + esc(f.title.toLowerCase()) + '</div>' + link + '</div>';
      }
      stage.appendChild(a);
      var d = document.createElement("button");
      d.type = "button"; d.setAttribute("aria-label", "show " + f.title);
      d.addEventListener("click", function () { go(i); });
      dotsWrap.appendChild(d);
    });

    var slides = stage.querySelectorAll(".slide"), dots = dotsWrap.querySelectorAll("button");
    if (!slides.length) { spot.style.display = "none"; return; }

    var idx = 0, DUR = 5000, elapsed = 0, paused = false, last = 0, raf;
    function paint() {
      slides.forEach(function (s, i) { s.classList.toggle("is-on", i === idx); });
      dots.forEach(function (d, i) { d.classList.toggle("cur", i === idx); });
    }
    function go(i) { idx = (i + slides.length) % slides.length; elapsed = 0; paint(); }
    function loop(ts) {
      if (!last) last = ts;
      var dt = ts - last; last = ts;
      if (!paused && slides.length > 1) {
        elapsed += dt;
        if (elapsed >= DUR) { go(idx + 1); }
        tick.style.width = Math.min(100, elapsed / DUR * 100) + "%";
      }
      raf = requestAnimationFrame(loop);
    }
    spot.addEventListener("mouseenter", function () { paused = true; });
    spot.addEventListener("mouseleave", function () { paused = false; });
    document.addEventListener("visibilitychange", function () { last = 0; });
    paint(); raf = requestAnimationFrame(loop);
  })();

  /* ---------- 2 · DIRECTORY BAND ---------- */
  H.sections().then(function (secs) {
    var band = document.getElementById("dir-band");
    band.innerHTML = secs.map(function (s) {
      return '<a class="dir-item" href="' + esc(s.href) + '">' +
        '<span class="dn">' + esc(s.name) + '</span>' +
        '<span class="dc">' + (s.n != null ? esc(s.n) : "&mdash;") + '</span>' +
        '<span class="dd">' + esc(s.desc) + '</span>' +
      '</a>';
    }).join("");
  });

  /* ---------- 3 · LATELY — the are.na feed ---------- */
  (function lately() {
    var feed = document.getElementById("feed"), live = document.getElementById("lh-live"),
        lately = document.getElementById("lately");

    // skeleton
    var hs = [190, 150, 240, 170, 210, 160, 200, 180, 230, 150, 200, 175];
    feed.innerHTML = hs.map(function (h) {
      return '<div class="fskel"><i style="height:' + h + 'px"></i></div>';
    }).join("");

    H.arena(38).then(function (r) {
      var blocks = (r && r.blocks) || [];
      if (!blocks.length) {
        feed.remove();
        live.remove();
        var note = document.createElement("p");
        note.className = "feed-empty";
        note.textContent = "the feed is quiet right now — check back later.";
        lately.querySelector(".lately-head").after(note);
        return;
      }
      var newest = H.whenAgo(blocks[0].when);
      live.className = "lh-live" + (r.live ? "" : " snap");
      live.innerHTML = '<span class="dot"></span>' +
        (r.live ? "live from are.na" : "from are.na") +
        (newest ? " &middot; updated " + esc(newest) : "");

      feed.innerHTML = blocks.map(function (b) {
        var src = b.src || "#", img = b.img || b.thumb, when = H.whenAgo(b.when);
        var t = (b.title || "").trim();
        return '<a class="fblock" href="' + esc(src) + '" target="_blank" rel="noopener" title="' + esc(t) + '">' +
          '<img loading="lazy" alt="' + esc(t) + '" src="' + esc(img) + '">' +
          '<span class="fmeta">' +
            '<span class="ft">' + (t ? esc(t) : "&mdash;") + '</span>' +
            (when ? '<span class="fw">' + esc(when) + '</span>' : "") +
          '</span></a>';
      }).join("");
    });
  })();

  /* draw hand-elements on what we just built */
  function hand() {
    if (window.Masthead) document.querySelectorAll("#home-body [data-drawn]").forEach(Masthead.drawHeading);
    if (window.Graphite) Graphite.init(body);
  }
  if (document.readyState === "complete") hand();
  else addEventListener("load", hand);
})();
</script>
</body>
</html>
