<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>con.rad — DIRECTION</title>
<script>try{var t=localStorage.getItem("studio.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="../assets/catalogue/shell.css" />
<script src="../assets/catalogue/graphite.js" defer></script>
<script src="../assets/catalogue/theme.js" defer></script>
<script src="../assets/catalogue/masthead.js" defer></script>
<script src="_home-data.js"></script>
<style>
  /* ---- header tuning (KEEP AS-IS) ---- */
  #cover { padding-top: clamp(18px, 4vh, 40px); }
  #cover .over.over-mark { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  #cover .over-mark .wordmark { justify-self: start; }
  #cover .over-mark .est { justify-self: end; }
  #cover .corner-logo { justify-self: center; width: clamp(150px, 20vw, 220px); }
  #cover .corner-logo .drawn-title { display: flex; justify-content: center; }
  #cover .corner-logo canvas { max-height: 50px; }
  #cover .cover-intro { margin-top: 22px; font-style: italic; text-align: center; max-width: none; }
  @media (max-width: 640px) {
    #cover .over.over-mark { grid-template-columns: 1fr; justify-items: center; gap: 6px; }
    #cover .over-mark .wordmark, #cover .over-mark .est { justify-self: center; }
  }

  /* ==================================================================
     YOUR DIRECTION'S STYLES — "CONTACT SHEET"
     ================================================================== */
  #home-body { margin-top: 40px; }

  /* --- the contact-sheet caption rail above the grid --- */
  .cs-rail {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px 18px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .22em;
    text-transform: lowercase; color: var(--ink-faint);
    padding-bottom: 10px; margin-bottom: 20px;
    border-bottom: 1px solid var(--rule);
  }
  .cs-rail .lead { color: var(--ink-soft); }
  .cs-rail .lead b { font-weight: 400; color: var(--sanguine); }
  .cs-rail .meta { display: flex; gap: 16px; flex-wrap: wrap; }

  /* --- the asymmetric grid --- */
  .cs-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-areas:
      "studio studio studio studio fav fav"
      "studio studio studio studio wri wri"
      "prj    prj    prj    col  col col";
    grid-auto-rows: minmax(178px, 20vw);
    gap: clamp(10px, 1.2vw, 16px);
  }
  .t-studio { grid-area: studio; }
  .t-fav    { grid-area: fav; }
  .t-wri    { grid-area: wri; }
  .t-prj    { grid-area: prj; }
  .t-col    { grid-area: col; }

  /* --- a tile --- */
  .tile {
    position: relative; display: block; overflow: hidden;
    border: 1px solid var(--rule); background: var(--paper-deep);
    padding: 16px 18px; min-width: 0; color: inherit;
    transition: transform .5s cubic-bezier(.2,.7,.2,1), box-shadow .5s cubic-bezier(.2,.7,.2,1), border-color .4s;
    will-change: transform;
  }
  .tile:hover, .tile:focus-visible {
    transform: translateY(-3px);
    box-shadow: 0 14px 34px rgba(var(--ink-rgb), .13);
    border-color: rgba(var(--ink-rgb), .4);
    z-index: 3; outline: none;
  }
  /* preview fills the tile, sits behind the text */
  .tile .prev { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .tile .fg { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; }
  /* readability scrim so text stays legible over imagery */
  .tile .scrim {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(180deg, rgba(var(--paper-rgb),.20) 0%, rgba(var(--paper-rgb),.55) 46%, rgba(var(--paper-rgb),.90) 100%);
    transition: opacity .5s ease;
  }
  html[data-theme="dark"] .tile .scrim {
    background: linear-gradient(180deg, rgba(var(--paper-rgb),.30) 0%, rgba(var(--paper-rgb),.60) 46%, rgba(var(--paper-rgb),.92) 100%);
  }
  .tile:hover .scrim { opacity: .82; }

  .tile .nm {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(24px, 3.2vw, 40px); line-height: 1.0; letter-spacing: .01em;
    transition: color .35s ease;
  }
  .tile:hover .nm, .tile:focus-visible .nm { color: var(--sanguine); }
  .tile .ct {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em;
    color: var(--ink-faint); margin-top: 7px;
  }
  .tile .ct b { color: var(--sanguine); font-weight: 400; }
  .tile .dsc {
    font-family: var(--font-text); font-style: italic; font-size: 13.5px;
    line-height: 1.4; color: var(--ink-soft); margin-top: auto; max-width: 30ch;
    padding-top: 12px;
  }
  .tile .enter {
    position: absolute; right: 16px; bottom: 14px; z-index: 3;
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em;
    text-transform: lowercase; color: var(--sanguine);
    opacity: 0; transform: translateX(-6px);
    transition: opacity .4s ease, transform .4s cubic-bezier(.2,.7,.2,1);
  }
  .tile:hover .enter, .tile:focus-visible .enter { opacity: 1; transform: translateX(0); }

  /* --- studio mosaic preview --- */
  .mosaic {
    position: absolute; inset: 0; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr;
    opacity: .22; filter: grayscale(.5) contrast(.95);
    transform: scale(1.02);
    transition: opacity .55s ease, filter .55s ease, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .mosaic img { width: 100%; height: 100%; object-fit: cover; }
  .tile:hover .mosaic { opacity: .48; filter: grayscale(0) contrast(1); transform: scale(1.05); }
  /* crisp thumbnails that slide in on hover (studio) */
  .chips {
    position: absolute; left: 16px; right: 16px; bottom: 46px; z-index: 2;
    display: flex; gap: 8px; pointer-events: none;
  }
  .chips .chip {
    flex: 1 1 0; aspect-ratio: 1/1; border: 1px solid rgba(var(--ink-rgb),.35);
    background: var(--paper) center/cover no-repeat; overflow: hidden;
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease, transform .55s cubic-bezier(.2,.7,.2,1);
  }
  .tile:hover .chip { opacity: 1; transform: translateY(0); }
  .tile:hover .chip:nth-child(2) { transition-delay: .06s; }
  .tile:hover .chip:nth-child(3) { transition-delay: .12s; }

  /* --- image preview (writings / projects / favourite artworks) --- */
  .imgprev {
    position: absolute; inset: 0; background-position: center; background-size: cover;
    opacity: .55; filter: grayscale(.45) contrast(.96);
    transform: scale(1.02);
    transition: opacity .55s ease, filter .55s ease, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .tile:hover .imgprev { opacity: .92; filter: grayscale(0) contrast(1.02); transform: scale(1.055); }

  /* --- typographic preview (collection / writing / project favourites, no image) --- */
  .typ {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .typ span {
    font-family: var(--font-degraded); font-size: clamp(70px, 12vw, 150px);
    line-height: .8; color: rgba(var(--ink-rgb), .09); letter-spacing: -.02em;
    transform: rotate(-4deg); white-space: nowrap; user-select: none;
    transition: color .55s ease, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .tile:hover .typ span { color: rgba(var(--sang-rgb), .16); transform: rotate(-4deg) scale(1.06); }

  /* --- the pinned favourite tile --- */
  .t-fav { background: var(--paper); }
  .fav-star {
    position: absolute; top: 13px; left: 16px; z-index: 3;
    color: var(--sanguine); font-size: 13px; line-height: 1;
  }
  .fav-kicker {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .18em;
    text-transform: lowercase; color: var(--ink-faint); margin: 2px 0 0 20px;
  }
  .fav-stage { position: relative; flex: 1; min-height: 0; }
  .fav-slide {
    position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .6s ease, transform .6s cubic-bezier(.2,.7,.2,1);
  }
  .fav-slide.on { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .fav-slide .ttl {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(22px, 2.6vw, 30px); line-height: 1.02;
  }
  .t-fav:hover .fav-slide.on .ttl { color: var(--sanguine); }
  .fav-slide .bl {
    font-family: var(--font-text); font-style: italic; font-size: 12.5px;
    line-height: 1.38; color: var(--ink-soft); margin-top: 5px; max-width: 34ch;
  }
  .fav-dots {
    position: absolute; right: 14px; bottom: 12px; z-index: 4;
    display: flex; gap: 7px; align-items: center;
  }
  .fav-dots button {
    width: 7px; height: 7px; padding: 0; border-radius: 50%;
    border: 1px solid rgba(var(--ink-rgb), .5); background: transparent; cursor: pointer;
    transition: background .3s ease, border-color .3s ease;
  }
  .fav-dots button.cur { background: var(--sanguine); border-color: var(--sanguine); }

  /* ==================================================================
     LATELY — the full-width are.na strip
     ================================================================== */
  .lately { margin-top: clamp(30px, 5vh, 54px); }
  .lately-head {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    border-bottom: 1px solid var(--ink); padding-bottom: 8px;
  }
  .lately-head h3 {
    font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0;
  }
  .lately-head .live {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em;
    text-transform: lowercase; color: var(--ink-faint);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .lately-head .live .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--sanguine);
    box-shadow: 0 0 0 0 rgba(var(--sang-rgb), .5);
  }
  .lately-head .live.is-live .dot { animation: pulse 2.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(var(--sang-rgb), .5); }
    70% { box-shadow: 0 0 0 6px rgba(var(--sang-rgb), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--sang-rgb), 0); }
  }
  .lately-head .src { margin-left: auto; }
  .lately-head .src a { color: var(--ink-faint); font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .14em; }
  .lately-head .src a:hover { color: var(--sanguine); }

  .lately-track {
    display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden;
    padding: 16px 2px 14px; margin: 0 -2px;
    scroll-snap-type: x proximity; scrollbar-width: thin;
    scrollbar-color: var(--rule) transparent;
  }
  .lately-track::-webkit-scrollbar { height: 7px; }
  .lately-track::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 4px; }
  .lately-track::-webkit-scrollbar-track { background: transparent; }
  .la-cell {
    position: relative; flex: 0 0 auto; width: clamp(118px, 15vw, 158px);
    aspect-ratio: 1/1; scroll-snap-align: start;
    border: 1px solid var(--rule); background: var(--paper-deep) center/cover no-repeat;
    overflow: hidden; transition: border-color .35s ease, transform .4s cubic-bezier(.2,.7,.2,1);
  }
  .la-cell img {
    width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(.35) contrast(.97); transition: filter .4s ease, transform .5s ease;
  }
  .la-cell:hover { border-color: rgba(var(--ink-rgb), .5); transform: translateY(-2px); }
  .la-cell:hover img { filter: grayscale(0) contrast(1.03); transform: scale(1.05); }
  .la-cell .cap {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    padding: 14px 8px 6px; opacity: 0; transform: translateY(4px);
    background: linear-gradient(180deg, rgba(var(--paper-rgb),0) 0%, rgba(var(--paper-rgb),.92) 70%);
    transition: opacity .35s ease, transform .35s ease;
  }
  .la-cell:hover .cap { opacity: 1; transform: translateY(0); }
  .la-cell .cap .t {
    font-family: var(--font-text); font-size: 11px; line-height: 1.2; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .la-cell .cap .w { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .1em; color: var(--sanguine); margin-top: 2px; }
  .lately-empty, .lately-loading {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    color: var(--ink-faint); padding: 22px 0;
  }
  .lately-skel { display: flex; gap: 12px; padding: 16px 2px; }
  .lately-skel i {
    flex: 0 0 auto; width: clamp(118px, 15vw, 158px); aspect-ratio: 1/1;
    border: 1px solid var(--rule-faint); background: var(--paper-deep);
    animation: shimmer 1.5s ease-in-out infinite; opacity: .6;
  }
  @keyframes shimmer { 0%,100% { opacity: .35; } 50% { opacity: .7; } }

  /* ==================================================================
     RESPONSIVE
     ================================================================== */
  @media (max-width: 900px) {
    .cs-grid {
      grid-template-columns: repeat(2, 1fr);
      grid-template-areas:
        "studio studio"
        "fav    wri"
        "prj    col";
      grid-auto-rows: minmax(190px, 30vw);
    }
  }
  @media (max-width: 560px) {
    #home-body { margin-top: 26px; }
    .cs-grid {
      grid-template-columns: 1fr;
      grid-template-areas: "studio" "fav" "wri" "prj" "col";
      grid-auto-rows: minmax(158px, 40vw);
    }
    .chips { bottom: 42px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile, .mosaic, .imgprev, .chip, .fav-slide, .la-cell, .la-cell img, .typ span { transition: none !important; }
    .lately-head .live.is-live .dot { animation: none; }
    .lately-skel i { animation: none; }
  }
</style>
</head>
<body class="on-cover">

<div class="wrap">
  <header class="mast" id="cover">
    <div class="over over-mark">
      <span class="wordmark">building curiosity...</span>
      <div class="corner-logo"><h1 data-drawn data-cap="30">con.rad</h1></div>
      <span class="est" title="established 02·04·1998">est. ii·iv·mcmxcviii</span>
    </div>
    <p class="cover-intro">chronically online, techno-curious, art and music junky.</p>
    <hr class="rule" />
  </header>

  <!-- ===== BODY: build your direction here (directory + favourites + are.na feed) ===== -->
  <main id="home-body"></main>

</div>

<footer class="colophon">
  <div class="cols">
    <span>con.rad</span>
    <a href="mailto:conradhouse1998@gmail.com">email</a>
    <a href="https://www.are.na/conrad-house" target="_blank" rel="noopener">are.na</a>
  </div>
  <span>set in happy times &amp; routed gothic</span>
</footer>

<script>
/* CONTACT SHEET — asymmetric section tiles + cycling favourite + are.na "lately" */
(function () {
  const H = window.HomeData, esc = H.esc, body = document.getElementById("home-body");
  const prefersStill = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // handles to fill after the shell is drawn
  let favState = null;

  function tileInner(s) {
    const cnt = s.n != null ? `<b>${s.n}</b> ${s.n === 1 ? "entry" : "entries"}` : "—";
    let prev = "";
    if (s.key === "studio" && s.peek && s.peek.length) {
      const cells = s.peek.map(sl => `<img loading="lazy" src="${esc(H.studioThumb(sl))}" alt="" onerror="this.style.visibility='hidden'">`).join("");
      const chips = s.peek.slice(0, 3).map(sl => `<span class="chip" style="background-image:url('${esc(H.studioThumb(sl))}')"></span>`).join("");
      prev = `<div class="prev"><div class="mosaic">${cells}</div></div><div class="scrim"></div><div class="chips">${chips}</div>`;
    } else if (s.img) {
      prev = `<div class="prev"><div class="imgprev" style="background-image:url('${esc(s.img)}')"></div></div><div class="scrim"></div>`;
    } else {
      prev = `<div class="prev"><div class="typ"><span>${esc(s.name)}</span></div></div><div class="scrim"></div>`;
    }
    return `${prev}
      <div class="fg">
        <div class="nm">${esc(s.name)}</div>
        <div class="ct">${cnt}</div>
        <div class="dsc">${esc(s.desc)}</div>
      </div>
      <span class="enter">enter &rarr;</span>`;
  }

  function build(sections) {
    const map = {}; sections.forEach(s => map[s.key] = s);
    const grid = document.createElement("div");
    grid.className = "cs-grid";

    function tile(key, cls) {
      const s = map[key]; if (!s) return "";
      return `<a class="tile ${cls}" href="${esc(s.href)}" aria-label="${esc(s.name)} — ${esc(s.desc)}">${tileInner(s)}</a>`;
    }

    // the pinned favourite tile (cycles)
    const favTile = `<div class="tile t-fav" role="group" aria-label="a favourite, cycling">
        <span class="fav-star" aria-hidden="true">&#10022;</span>
        <div class="fav-kicker">pinned</div>
        <div class="fg"><div class="fav-stage" id="fav-stage"></div></div>
        <div class="fav-dots" id="fav-dots"></div>
      </div>`;

    grid.innerHTML =
      tile("studio", "t-studio") +
      favTile +
      tile("writings", "t-wri") +
      tile("projects", "t-prj") +
      tile("collection", "t-col");

    // caption rail
    const rail = document.createElement("div");
    rail.className = "cs-rail";
    const total = sections.reduce((a, s) => a + (s.n || 0), 0);
    rail.innerHTML = `<span class="lead">a <b>contact sheet</b> of the site &mdash; four rooms, ${total} things</span>
      <span class="meta">${sections.map(s => `${esc(s.name)} <b style="color:var(--sanguine);font-weight:400">${s.n != null ? s.n : "&mdash;"}</b>`).join("")}</span>`;

    body.appendChild(rail);
    body.appendChild(grid);

    setupFavourites();
    // the are.na strip
    const lately = document.createElement("section");
    lately.className = "lately";
    lately.innerHTML = `<div class="lately-head">
        <h3>lately</h3>
        <span class="live" id="la-live"><span class="dot"></span><span id="la-live-txt">connecting&hellip;</span></span>
        <span class="src"><a href="https://www.are.na/conrad-house/visually-intriguing" target="_blank" rel="noopener">are.na/visually-intriguing &rarr;</a></span>
      </div>
      <div id="la-body"><div class="lately-skel">${Array.from({length:8}).map(()=>"<i></i>").join("")}</div></div>`;
    body.appendChild(lately);
    loadArena();

    // redraw the drawn/pencil helpers over freshly-inserted DOM
    if (window.Graphite && Graphite.init) try { Graphite.init(body); } catch (_) {}
  }

  // ---------- favourites cycling ----------
  function favSlideHTML(f) {
    let bg = "";
    if (f.img) bg = `<div class="prev"><div class="imgprev" style="background-image:url('${esc(f.img)}')"></div></div><div class="scrim"></div>`;
    else bg = `<div class="prev"><div class="typ"><span>${esc(f.title)}</span></div></div><div class="scrim"></div>`;
    return bg + `<div class="fav-slide" data-role="slide">
        <span class="fav-kicker" style="margin:0 0 4px;">${esc(f.kicker)}</span>
        <div class="ttl">${esc(f.title)}</div>
        <div class="bl">${esc(f.blurb)}</div>
      </div>`;
  }

  function setupFavourites() {
    const favs = (H.FAVORITES || []).slice();
    const stage = document.getElementById("fav-stage");
    const dotsEl = document.getElementById("fav-dots");
    const tile = stage.closest(".t-fav");
    if (!favs.length || !stage) return;

    // render each favourite as its own layered slide (bg + text) inside the stage
    stage.innerHTML = favs.map((f, i) =>
      `<a class="fav-layer" href="${esc(f.href)}" data-i="${i}" style="position:absolute;inset:0;display:block;color:inherit;padding:0 2px 2px 0">${favSlideHTML(f)}</a>`
    ).join("");
    dotsEl.innerHTML = favs.map((f, i) =>
      `<button data-i="${i}" aria-label="favourite ${i + 1}: ${esc(f.title)}"></button>`).join("");

    const layers = [...stage.querySelectorAll(".fav-layer")];
    const dots = [...dotsEl.querySelectorAll("button")];
    // stack layers, only show the current
    layers.forEach(l => { l.style.opacity = "0"; l.style.transition = "opacity .6s ease"; l.style.pointerEvents = "none"; });

    let cur = 0, timer = null;
    function show(i, focus) {
      cur = (i + favs.length) % favs.length;
      layers.forEach((l, k) => {
        const on = k === cur;
        l.style.opacity = on ? "1" : "0";
        l.style.pointerEvents = on ? "auto" : "none";
        l.querySelector(".fav-slide").classList.toggle("on", on);
      });
      dots.forEach((d, k) => d.classList.toggle("cur", k === cur));
    }
    function next() { show(cur + 1); }
    function start() { if (prefersStill) return; stop(); timer = setInterval(next, 5000); }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }

    dots.forEach(d => d.addEventListener("click", e => {
      e.preventDefault(); e.stopPropagation();
      show(+d.dataset.i); start();
    }));
    tile.addEventListener("mouseenter", stop);
    tile.addEventListener("mouseleave", start);
    tile.addEventListener("focusin", stop);
    tile.addEventListener("focusout", start);

    show(0);
    start();
    favState = { show, next };
  }

  // ---------- are.na "lately" ----------
  async function loadArena() {
    const host = document.getElementById("la-body");
    const live = document.getElementById("la-live");
    const liveTxt = document.getElementById("la-live-txt");
    let res;
    try { res = await H.arena(18); } catch (_) { res = { live: false, blocks: [] }; }
    const blocks = (res && res.blocks) || [];

    if (!blocks.length) {
      host.innerHTML = `<div class="lately-empty">nothing to show from are.na right now.</div>`;
      liveTxt.textContent = "offline";
      return;
    }
    live.classList.toggle("is-live", !!res.live);
    liveTxt.textContent = res.live ? "live from are.na" : "from a recent snapshot";

    const track = document.createElement("div");
    track.className = "lately-track";
    track.innerHTML = blocks.map(b => {
      const img = b.thumb || b.img;
      const when = H.whenAgo(b.when);
      const t = b.title ? `<div class="t">${esc(b.title)}</div>` : "";
      return `<a class="la-cell" href="${esc(b.src || "#")}" target="_blank" rel="noopener" title="${esc(b.title || "are.na block")}">
          <img loading="lazy" src="${esc(img)}" alt="${esc(b.title || "")}" onerror="this.closest('.la-cell').remove()">
          <div class="cap">${t}${when ? `<div class="w">${esc(when)}</div>` : ""}</div>
        </a>`;
    }).join("");
    host.innerHTML = "";
    host.appendChild(track);
  }

  // ---------- go ----------
  (async function () {
    let sections;
    try { sections = await H.sections(); }
    catch (e) {
      body.innerHTML = `<div class="load-error">could not load the site index &mdash; ${esc(e && e.message || e)}</div>`;
      return;
    }
    build(sections);
  })();
})();
</script>
</body>
</html>
