<!DOCTYPE html>
<html lang="en" data-theme="cream">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>con.rad — the index that opens</title>
<script>try{var t=localStorage.getItem("studio.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="../assets/catalogue/shell.css" />
<script src="../assets/catalogue/graphite.js" defer></script>
<script src="../assets/catalogue/theme.js" defer></script>
<script src="../assets/catalogue/masthead.js" defer></script>
<script src="_home-data.js"></script>
<style>
  /* ---- header tuning (KEEP AS-IS) ---- */
  #cover { padding-top: clamp(18px, 4vh, 40px); }
  #cover .over.over-mark { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
  #cover .over-mark .wordmark { justify-self: start; }
  #cover .over-mark .est { justify-self: end; }
  #cover .corner-logo { justify-self: center; width: clamp(150px, 20vw, 220px); }
  #cover .corner-logo .drawn-title { display: flex; justify-content: center; }
  #cover .corner-logo canvas { max-height: 50px; }
  #cover .cover-intro { margin-top: 22px; font-style: italic; text-align: center; max-width: none; }
  @media (max-width: 640px) {
    #cover .over.over-mark { grid-template-columns: 1fr; justify-items: center; gap: 6px; }
    #cover .over-mark .wordmark, #cover .over-mark .est { justify-self: center; }
  }

  /* ==================================================================
     THE INDEX THAT OPENS — directory + synced preview + spotlight
     ================================================================== */
  #home-body { margin-top: 46px; }

  /* ---- favourite spotlight (auto-cycling) ---- */
  .spot {
    position: relative;
    border: 1px solid var(--ink);
    background: var(--paper-deep);
    margin-bottom: 40px;
    overflow: hidden;
  }
  .spot-inner {
    display: grid;
    grid-template-columns: minmax(0, 300px) 1fr;
    min-height: 232px;
    transition: opacity .5s ease;
  }
  .spot-inner.typo { grid-template-columns: 1fr; }
  .spot.swapping .spot-inner { opacity: 0; }
  .spot-fig {
    position: relative; overflow: hidden;
    border-right: 1px solid var(--rule);
    background: var(--paper);
    min-height: 200px;
  }
  .spot-fig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .spot-body {
    padding: clamp(24px, 3vw, 40px) clamp(24px, 3.4vw, 48px);
    display: flex; flex-direction: column; justify-content: center; gap: 12px;
  }
  .spot-inner.typo .spot-body { padding: clamp(30px, 5vw, 58px) clamp(28px, 4vw, 56px); }
  .spot-kick {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .26em;
    text-transform: lowercase; color: var(--sanguine);
  }
  .spot-title {
    font-family: var(--font-display); font-weight: 400; line-height: 1.0;
    font-size: clamp(34px, 5vw, 58px); letter-spacing: .01em;
  }
  .spot-inner.typo .spot-title { font-size: clamp(40px, 7vw, 76px); }
  .spot-blurb {
    font-family: var(--font-text); font-size: 15.5px; line-height: 1.6;
    color: var(--ink-soft); max-width: 46ch; font-style: italic;
  }
  .spot-go {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em;
    text-transform: lowercase; color: var(--ink-faint); margin-top: 4px;
    display: inline-flex; align-items: baseline; gap: 7px;
  }
  .spot-go .arw { color: var(--sanguine); transition: transform .3s ease; }
  .spot:hover .spot-go .arw { transform: translateX(4px); }

  /* spotlight controls (dots + label + arrows) */
  .spot-nav {
    position: absolute; right: 16px; bottom: 12px;
    display: flex; align-items: center; gap: 12px; z-index: 3;
  }
  .spot-eyebrow {
    position: absolute; left: 16px; top: 13px; z-index: 3;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .24em;
    text-transform: lowercase; color: var(--ink-faint);
  }
  .spot-inner.typo ~ .spot-eyebrow { color: var(--ink-faint); }
  .spot-dots { display: flex; gap: 7px; }
  .spot-dot {
    width: 6px; height: 6px; border-radius: 50%; padding: 0;
    border: 1px solid var(--ink-faint); background: transparent; cursor: pointer;
    transition: background .3s ease, border-color .3s ease; -webkit-appearance: none; appearance: none;
  }
  .spot-dot.cur { background: var(--sanguine); border-color: var(--sanguine); }
  .spot-arrows { display: flex; gap: 2px; }
  .spot-arrows button {
    font-family: var(--font-mono); font-size: 13px; line-height: 1;
    width: 22px; height: 22px; padding: 0; cursor: pointer;
    background: transparent; border: 1px solid var(--rule); color: var(--ink-soft);
    transition: color .2s, border-color .2s;
  }
  .spot-arrows button:hover { color: var(--sanguine); border-color: var(--sanguine); }

  /* ---- the two-column index ---- */
  .open {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    border: 1px solid var(--ink);
  }
  .dir { border-right: 1px solid var(--rule); }
  .orow {
    display: block; position: relative;
    border-bottom: 1px solid var(--rule-faint);
    cursor: pointer;
  }
  .orow:last-child { border-bottom: 0; }
  .orow-head {
    display: grid; grid-template-columns: 34px 1fr auto;
    align-items: baseline; gap: 14px;
    padding: 22px clamp(20px, 2.4vw, 32px);
    transition: background .35s ease;
  }
  .orow.on .orow-head { background: var(--paper-deep); }
  .orow .rn {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    color: var(--sanguine);
  }
  .orow .nm {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(27px, 3.6vw, 40px); line-height: 1.0;
    transition: color .3s ease;
  }
  .orow.on .nm, .orow:hover .nm { color: var(--sanguine); }
  .orow .desc {
    display: block; font-family: var(--font-text); font-style: italic;
    font-size: 13.5px; color: var(--ink-faint); margin-top: 5px;
  }
  .orow .ct {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    color: var(--sanguine); align-self: center; white-space: nowrap;
  }
  .orow .ct .lab { color: var(--ink-faint); letter-spacing: .16em; }

  /* inline filmstrip that opens downward */
  .strip-wrap {
    display: grid; grid-template-rows: 0fr;
    transition: grid-template-rows .42s cubic-bezier(.4,0,.15,1);
  }
  .orow.on .strip-wrap { grid-template-rows: 1fr; }
  .strip-clip { overflow: hidden; min-height: 0; }
  .strip {
    display: flex; gap: 8px; align-items: stretch;
    padding: 0 clamp(20px, 2.4vw, 32px) 20px calc(34px + clamp(20px, 2.4vw, 32px) + 14px);
    overflow-x: auto; overflow-y: hidden;
    opacity: 0; transform: translateY(-4px);
    transition: opacity .4s ease .08s, transform .4s ease .08s;
    scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
  }
  .orow.on .strip { opacity: 1; transform: none; }
  .strip::-webkit-scrollbar { height: 5px; }
  .strip::-webkit-scrollbar-thumb { background: var(--rule); }
  .strip-thumb {
    flex: 0 0 auto; width: 62px; height: 62px;
    border: 1px solid var(--rule); background: var(--paper);
    overflow: hidden;
  }
  .strip-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .strip-chip {
    flex: 0 0 auto; height: 62px; padding: 0 16px;
    border: 1px solid var(--rule); background: var(--paper);
    display: flex; align-items: center; text-align: center;
    font-family: var(--font-display); font-size: 16px; line-height: 1.1;
    color: var(--ink-soft);
  }

  /* ---- the synced preview panel ---- */
  .preview {
    position: relative;
    background: var(--paper-deep);
    display: flex; flex-direction: column;
  }
  .pv-stage {
    position: relative; flex: 1; margin: 18px 18px 0;
    border: 1px solid var(--rule); background: var(--paper);
    overflow: hidden; min-height: 300px;
  }
  .pv-layer {
    position: absolute; inset: 0;
    opacity: 0; transition: opacity .55s ease;
    display: flex; align-items: center; justify-content: center;
  }
  .pv-layer.cur { opacity: 1; }
  .pv-layer img { width: 100%; height: 100%; object-fit: cover; }
  .pv-layer.typo { flex-direction: column; gap: 10px; padding: 30px; text-align: center; }
  .pv-layer.typo .pv-word {
    font-family: var(--font-display); font-size: clamp(38px, 6vw, 64px);
    line-height: 1; color: var(--ink-soft);
  }
  .pv-cap {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    padding: 13px 20px 16px; margin-top: 2px;
  }
  .pv-cap .pv-nm {
    font-family: var(--font-display); font-size: 21px; line-height: 1;
    transition: opacity .4s ease;
  }
  .pv-cap .pv-n {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em;
    color: var(--ink-faint); text-transform: lowercase;
  }
  .pv-cap .pv-n b { color: var(--sanguine); font-weight: 400; }

  /* ---- are.na "lately" strip ---- */
  .lately { margin-top: 44px; }
  .lately-head {
    display: flex; align-items: baseline; gap: 14px;
    border-bottom: 1px solid var(--ink); padding-bottom: 9px;
  }
  .lately-head h3 {
    margin: 0; font-family: var(--font-display); font-weight: 400;
    font-size: 21px; line-height: 1;
  }
  .lately-head .live {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .18em;
    text-transform: lowercase; color: var(--ink-faint);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .lately-head .live .dot {
    width: 5px; height: 5px; border-radius: 50%; background: var(--sanguine);
  }
  .lately-head .live.on .dot { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .lately-head .src { margin-left: auto; }
  .lately-head .src a {
    font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em;
    text-transform: lowercase; color: var(--ink-faint);
  }
  .lately-head .src a:hover { color: var(--sanguine); }
  .lately-grid {
    display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 14px; margin-top: 20px;
  }
  .lately-item { display: block; }
  .lately-item .lf {
    aspect-ratio: 1 / 1; border: 1px solid var(--rule);
    background: var(--paper-deep); overflow: hidden;
  }
  .lately-item .lf img {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform .5s ease, filter .5s ease;
    filter: grayscale(.15);
  }
  .lately-item:hover .lf img { transform: scale(1.05); filter: none; }
  .lately-item .lt {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
    color: var(--ink-soft); margin-top: 7px; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .lately-item:hover .lt { color: var(--sanguine); }
  .lately-item .lw {
    font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .1em;
    color: var(--ink-faint); text-transform: lowercase; margin-top: 2px;
  }
  .lately-loading {
    font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em;
    color: var(--ink-faint); text-transform: lowercase; padding: 24px 0;
  }

  /* ---- responsive ---- */
  @media (max-width: 860px) {
    .open { grid-template-columns: 1fr; }
    .dir { border-right: 0; }
    .preview { display: none; }
    .orow.on .strip-wrap { grid-template-rows: 1fr; }
    .lately-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 560px) {
    .spot-inner { grid-template-columns: 1fr; }
    .spot-fig { border-right: 0; border-bottom: 1px solid var(--rule); min-height: 168px; }
    .spot-nav { position: static; justify-content: flex-end; padding: 0 16px 12px; }
    .spot-eyebrow { position: static; display: block; padding: 12px 16px 0; }
    .lately-grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  }
  @media (max-width: 400px) {
    .lately-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body class="on-cover">

<div class="wrap">
  <header class="mast" id="cover">
    <div class="over over-mark">
      <span class="wordmark">building curiosity...</span>
      <div class="corner-logo"><h1 data-drawn data-cap="30">con.rad</h1></div>
      <span class="est" title="established 02·04·1998">est. ii·iv·mcmxcviii</span>
    </div>
    <p class="cover-intro">chronically online, techno-curious, art and music junky.</p>
    <hr class="rule" />
  </header>

  <!-- ===== BODY: the index that opens ===== -->
  <main id="home-body">
    <!-- favourite spotlight -->
    <section class="spot" id="spot" aria-label="featured">
      <span class="spot-eyebrow">favourite</span>
      <div class="spot-inner" id="spot-inner"></div>
      <div class="spot-nav">
        <div class="spot-dots" id="spot-dots"></div>
        <div class="spot-arrows">
          <button type="button" id="spot-prev" aria-label="previous">&larr;</button>
          <button type="button" id="spot-next" aria-label="next">&rarr;</button>
        </div>
      </div>
    </section>

    <!-- the directory + synced preview -->
    <div class="open">
      <div class="dir" id="dir"></div>
      <aside class="preview" id="preview" aria-hidden="true">
        <div class="pv-stage" id="pv-stage"></div>
        <div class="pv-cap"><span class="pv-nm" id="pv-nm"></span><span class="pv-n" id="pv-n"></span></div>
      </aside>
    </div>

    <!-- are.na "lately" -->
    <section class="lately" id="lately" aria-label="lately from are.na">
      <div class="lately-head">
        <h3>lately</h3>
        <span class="live" id="lately-live"><span class="dot"></span><span id="lately-live-t">connecting&hellip;</span></span>
        <span class="src"><a href="https://www.are.na/conrad-house/visually-intriguing" target="_blank" rel="noopener">are.na/visually-intriguing &nearr;</a></span>
      </div>
      <div class="lately-grid" id="lately-grid"><div class="lately-loading">gathering recent finds&hellip;</div></div>
    </section>
  </main>

</div>

<footer class="colophon">
  <div class="cols">
    <span>con.rad</span>
    <a href="mailto:conradhouse1998@gmail.com">email</a>
    <a href="https://www.are.na/conrad-house" target="_blank" rel="noopener">are.na</a>
  </div>
  <span>set in happy times &amp; routed gothic</span>
</footer>

<script>
/* THE INDEX THAT OPENS — favourites spotlight + synced hover preview + are.na lately */
(function () {
  const H = window.HomeData, esc = H.esc;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- favourite spotlight (auto-cycle) ---------------- */
  (function spotlight() {
    const favs = H.FAVORITES || [];
    if (!favs.length) { document.getElementById("spot").style.display = "none"; return; }
    const spot = document.getElementById("spot");
    const inner = document.getElementById("spot-inner");
    const dotsWrap = document.getElementById("spot-dots");
    let i = 0, timer = null, paused = false;

    favs.forEach((_, k) => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "spot-dot"; b.setAttribute("aria-label", "favourite " + (k + 1));
      b.addEventListener("click", () => { go(k, true); });
      dotsWrap.appendChild(b);
    });
    const dots = [...dotsWrap.children];

    function render(f) {
      const typo = !f.img;
      const fig = typo ? "" :
        `<div class="spot-fig"><img src="${esc(f.img)}" alt="" loading="lazy"></div>`;
      inner.className = "spot-inner" + (typo ? " typo" : "");
      inner.innerHTML = fig +
        `<div class="spot-body">
           <span class="spot-kick">${esc(f.kicker || "")}</span>
           <span class="spot-title">${esc(f.title || "")}</span>
           <span class="spot-blurb">${esc(f.blurb || "")}</span>
           <a class="spot-go" href="${esc(f.href || "#")}">view <span class="arw">&rarr;</span></a>
         </div>`;
      // whole card links via the body anchor; also make the figure clickable
      const fg = inner.querySelector(".spot-fig");
      if (fg) fg.addEventListener("click", () => { location.href = f.href || "#"; });
    }

    function go(n, manual) {
      i = (n + favs.length) % favs.length;
      dots.forEach((d, k) => d.classList.toggle("cur", k === i));
      if (reduce) { render(favs[i]); }
      else {
        spot.classList.add("swapping");
        setTimeout(() => { render(favs[i]); spot.classList.remove("swapping"); }, 320);
      }
      if (manual) restart();
    }
    function next() { go(i + 1); }
    function restart() { if (timer) clearInterval(timer); if (!reduce) timer = setInterval(() => { if (!paused) next(); }, 5000); }

    document.getElementById("spot-next").addEventListener("click", () => go(i + 1, true));
    document.getElementById("spot-prev").addEventListener("click", () => go(i - 1, true));
    spot.addEventListener("mouseenter", () => { paused = true; });
    spot.addEventListener("mouseleave", () => { paused = false; });

    render(favs[0]); dots[0].classList.add("cur"); restart();
  })();

  /* ---------------- directory + synced preview ---------------- */
  (async function directory() {
    const dir = document.getElementById("dir");
    const pvStage = document.getElementById("pv-stage");
    const pvNm = document.getElementById("pv-nm");
    const pvN = document.getElementById("pv-n");
    let secs;
    try { secs = await H.sections(); } catch (e) { secs = []; }
    if (!secs.length) { dir.innerHTML = '<div class="lately-loading" style="padding:28px 26px">could not load sections</div>'; return; }

    // build a preview layer per section (cross-faded)
    const layers = {};
    secs.forEach((s, idx) => {
      const layer = document.createElement("div");
      layer.className = "pv-layer" + (s.img ? "" : " typo");
      if (s.img) layer.innerHTML = `<img src="${esc(s.img)}" alt="" loading="lazy">`;
      else layer.innerHTML = `<span class="pv-word">${esc(s.name)}</span>`;
      pvStage.appendChild(layer);
      layers[s.key] = layer;
    });

    function showPreview(s) {
      Object.values(layers).forEach(l => l.classList.remove("cur"));
      (layers[s.key] || {}).classList && layers[s.key].classList.add("cur");
      pvNm.textContent = s.name;
      pvN.innerHTML = s.n != null ? `<b>${s.n}</b> ${s.n === 1 ? "entry" : "entries"}` : "explore &rarr;";
    }

    // rows
    secs.forEach((s, idx) => {
      const row = document.createElement("a");
      row.className = "orow"; row.href = s.href; row.dataset.key = s.key;
      const num = String(idx + 1).padStart(2, "0");
      const ctLab = s.n != null ? `${s.n} <span class="lab">${s.n === 1 ? "entry" : "entries"}</span>` : `<span class="lab">explore &rarr;</span>`;

      // filmstrip contents
      let strip = "";
      if (s.key === "studio" && s.peek && s.peek.length) {
        strip = s.peek.map(slug =>
          `<div class="strip-thumb"><img src="${esc(H.studioThumb(slug))}" alt="" loading="lazy"></div>`).join("");
      } else if (s.img) {
        strip = `<div class="strip-thumb" style="width:100px"><img src="${esc(s.img)}" alt="" loading="lazy"></div>` +
                `<div class="strip-chip">${esc(s.name)}</div>` +
                `<div class="strip-chip">${esc(s.n != null ? s.n + " inside" : "explore")}</div>`;
      } else {
        // typographic chips (e.g. collection — remote images)
        const words = s.desc.split(/[ ,]+/).filter(Boolean).slice(0, 4);
        strip = words.map(w => `<div class="strip-chip">${esc(w)}</div>`).join("");
      }

      row.innerHTML =
        `<div class="orow-head">
           <span class="rn">${num}</span>
           <span class="body"><span class="nm">${esc(s.name)}</span><span class="desc">${esc(s.desc)}</span></span>
           <span class="ct">${ctLab}</span>
         </div>
         <div class="strip-wrap"><div class="strip-clip"><div class="strip">${strip}</div></div></div>`;

      const open = () => {
        [...dir.children].forEach(r => r.classList.remove("on"));
        row.classList.add("on");
        showPreview(s);
      };
      row.addEventListener("mouseenter", open);
      row.addEventListener("focus", open);
      dir.appendChild(row);
    });

    // default state: first row's section in the preview (no row visually "on")
    showPreview(secs[0]);
    dir.firstElementChild.classList.add("on");
  })();

  /* ---------------- are.na "lately" ---------------- */
  (async function lately() {
    const grid = document.getElementById("lately-grid");
    const live = document.getElementById("lately-live");
    const liveT = document.getElementById("lately-live-t");
    let res;
    try { res = await H.arena(12); } catch (e) { res = { live: false, blocks: [] }; }
    const blocks = (res.blocks || []).filter(b => b.thumb || b.img).slice(0, 6);

    if (!blocks.length) {
      document.getElementById("lately").style.display = "none";
      return;
    }
    live.classList.toggle("on", !!res.live);
    liveT.textContent = res.live ? "live from are.na" : "recent snapshot";

    grid.innerHTML = blocks.map(b => {
      const when = H.whenAgo(b.when);
      const title = b.title || "untitled";
      return `<a class="lately-item" href="${esc(b.src || "#")}" target="_blank" rel="noopener" title="${esc(title)}">
          <div class="lf"><img src="${esc(b.thumb || b.img)}" alt="" loading="lazy"></div>
          <div class="lt">${esc(title)}</div>
          ${when ? `<div class="lw">${esc(when)}</div>` : ""}
        </a>`;
    }).join("");
  })();
})();
</script>
</body>
</html>
