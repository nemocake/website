<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Writings | con.rad">
  <title>Writings | con.rad</title>

  <!-- Config Loader -->
  <script src="../assets/js/config-loader.js"></script>

  <!-- Tailwind CSS -->
  <script>try{var t=localStorage.getItem("studio.theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'mono': ['"JetBrains Mono"', 'monospace'],
            'sans': ['"Space Grotesk"', 'sans-serif'],
            'display': ['"Syne"', 'sans-serif'],
          },
          colors: {
            'acid': '#ccff00',
            'neon-blue': '#00f3ff',
            'void': '#050505',
            'glass': 'rgba(255, 255, 255, 0.05)',
            'glass-dark': 'rgba(0, 0, 0, 0.6)',
            'border-dim': 'rgba(255, 255, 255, 0.1)',
          },
          animation: {
            'pulse-glow': 'pulse-glow 2s ease-in-out infinite',
          },
          keyframes: {
            'pulse-glow': {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.5' },
            }
          }
        }
      }
    }
  </script>

  <!-- Studio type + retint (self-hosted, no CDN) -->
  <script src="../assets/catalogue/theme.js" defer></script>

  <style>
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #050505;
    }
    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ccff00;
    }

    /* Scanlines overlay */
    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0,0,0,0.1) 50%,
        rgba(0,0,0,0.1)
      );
      background-size: 100% 4px;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.6;
    }

    /* Noise overlay */
    .noise {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* Selection */
    ::selection {
      background: #ccff00;
      color: #000;
    }

    /* Glass panel */
    .glass-panel {
      background: rgba(10, 10, 10, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    /* Article reveal animation */
    .writing-section {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .writing-section.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Intro reveal */
    .writings-intro {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .writings-intro.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Nav link active state */
    .nav-link-item.is-active {
      color: var(--sanguine);
      border-left-color: var(--sanguine);
    }
  </style>


  <!-- STUDIO RETINT — palette + fonts aligned to the catalogue; layout untouched -->
  <link rel="stylesheet" href="../assets/catalogue/retint.css" />
  <!-- favicon: cube-study plate -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
</head>
<body class="bg-void text-gray-200 antialiased overflow-x-hidden selection:bg-acid selection:text-black">

  <!-- Overlays -->
  <div class="scanlines"></div>
  <div class="noise"></div>

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 px-6 py-4 flex justify-between items-start pointer-events-none mix-blend-difference text-white">
    <a href="../" class="pointer-events-auto site-home">con.rad</a>

    <nav class="pointer-events-auto site-links" aria-label="site">
      <a href="../writings/" class="cur" aria-current="page">writings</a>
      <a href="../collection/">collection</a>
      <a href="../projects/">projects</a>
      <a href="../studio/">studio</a>
    </nav>
  </header>

  <!-- Main Layout -->
  <main class="relative z-10 pt-32 pb-48 px-4 md:px-0 max-w-7xl mx-auto flex flex-col md:flex-row gap-8">

    <!-- Sidebar Navigation -->
    <aside class="md:w-1/4 md:sticky md:top-32 h-fit">
      <div class="glass-panel p-6 rounded-sm">
        <div class="flex items-center gap-3 mb-6">
          <h2 class="font-display text-xl font-bold lowercase">Writings</h2>
        </div>

        <div class="border-t border-dashed border-gray-700 my-4"></div>

        <nav>
          <ul id="writings-nav-list" class="space-y-1">
            <!-- Populated by JS -->
          </ul>
        </nav>
      </div>

      <!-- Back to home -->
      <a href="../" class="glass-panel p-4 mt-4 flex items-center justify-center gap-2 hover:bg-acid hover:text-black transition-all group rounded-sm">
        <span class="font-mono text-xl group-hover:-translate-x-1 transition-transform">←</span>
        <span class="font-mono text-xs uppercase tracking-widest">Back Home</span>
      </a>
    </aside>

    <!-- Content Area -->
    <div class="md:w-3/4 space-y-16">

      <!-- Header (one-liner only — the nav already says where you are) -->
      <div class="mb-8 pb-4 border-b border-border-dim">
        <p class="font-sans text-gray-400">Thoughts on art, technology, and the spaces between. Essays and reflections on what I'm learning and building.</p>
      </div>

      <!-- Articles Container -->
      <div id="writings-articles" class="space-y-12">
        <!-- Populated by JS -->
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-10 border-t border-white/10 bg-black/80 backdrop-blur-md mt-12 py-12">
    <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-end gap-6">
      <div>
        <h3 class="font-display text-2xl mb-2">con.rad</h3>
        <p class="font-mono text-xs text-gray-500">© <span id="current-year"></span> conrad house. curiously tinkering and breaking things.</p>
      </div>
      <div class="flex gap-6 font-mono text-xs">
        <a href="mailto:conradhouse1998@gmail.com" class="hover:text-acid hover:underline">email</a>
        <a href="https://github.com/nemocake" target="_blank" class="hover:text-acid hover:underline">github</a>
        <a href="https://x.com/DlSPUTED" target="_blank" class="hover:text-acid hover:underline">twitter</a>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script>
    // Current year
    document.getElementById('current-year').textContent = new Date().getFullYear();

    (function() {
      // Function to render writings
      function renderWritings(writings) {
        if (!writings || writings.length === 0) return;

        // Escape HTML so code blocks render literally (not executed / parsed as markup)
        const escHtml = (s) => String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // Format date helper (Month Day, Year) - parse as local to avoid timezone shift
        const formatDate = (dateStr) => {
          const [year, month, day] = dateStr.split('-').map(Number);
          const date = new Date(year, month - 1, day);
          return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        };

        // Render navigation
        const navList = document.getElementById('writings-nav-list');
        navList.innerHTML = writings.map((item, index) => `
          <li>
            <a href="#${item.id}" class="nav-link-item block font-mono text-xs text-gray-400 hover:text-acid py-2 px-3 border-l-2 border-transparent hover:border-acid/50 transition-all ${index === 0 ? 'is-active' : ''}">
              <span class="text-gray-600 mr-2">${String(index + 1).padStart(2, '0')}</span>
              ${item.title}
            </a>
          </li>
        `).join('');

        // Render articles
        const articlesContainer = document.getElementById('writings-articles');
        articlesContainer.innerHTML = writings.map((item, index) => {
          // Support mixed content: strings become paragraphs, objects render by type
          const bodyHtml = item.body.map(p => {
            if (typeof p === 'string') {
              return `<p class="mb-6 last:mb-0">${p}</p>`;
            } else if (p.type === 'quote') {
              const attr = p.attribution ? `<footer class="not-italic mt-2 text-xs text-gray-500 tracking-wider">— ${p.attribution}</footer>` : '';
              return `<blockquote class="my-8 pl-6 border-l-2 border-acid/50 italic text-gray-400">"${p.text}"${attr}</blockquote>`;
            } else if (p.type === 'image') {
              const captionHtml = p.caption ? `<figcaption class="mt-2 font-mono text-xs text-gray-500 text-center">${p.caption}</figcaption>` : '';
              return `<figure class="my-8">
                <img src="${p.src}" alt="${p.alt || ''}" class="w-full max-w-2xl mx-auto" loading="lazy" style="display:block;">
                ${captionHtml}
              </figure>`;
            } else if (p.type === 'triptych') {
              const imgs = (p.images || []).map(img => {
                const cap = img.caption ? `<figcaption class="mt-2 font-mono text-[10px] text-gray-500 text-center">${img.caption}</figcaption>` : '';
                return `<figure><img src="${img.src}" alt="${img.alt || ''}" class="w-full h-64 object-contain bg-black/40 rounded-sm border border-border-dim" loading="lazy">${cap}</figure>`;
              }).join('');
              return `<div class="my-8 grid grid-cols-1 md:grid-cols-3 gap-4">${imgs}</div>`;
            } else if (p.type === 'subhead') {
              return `<h3 class="font-display text-xl md:text-2xl mt-10 mb-3">${p.text || ''}</h3>`;
            } else if (p.type === 'code') {
              const label = (p.file || p.title) ? `<div class="font-mono text-[10px] text-gray-500 mb-2">${p.file ? `<span class="text-acid/70">${escHtml(p.file)}</span>` : ''}${(p.file && p.title) ? ' — ' : ''}${p.title ? escHtml(p.title) : ''}</div>` : '';
              const cap = p.caption ? `<figcaption class="mt-2 font-mono text-[10px] text-gray-500">${p.caption}</figcaption>` : '';
              return `<figure class="my-6">
                ${label}
                <pre class="border border-border-dim bg-black/30 rounded-sm p-4 overflow-x-auto text-xs leading-relaxed"><code class="font-mono">${escHtml(p.code || '')}</code></pre>
                ${cap}
              </figure>`;
            } else if (p.type === 'pair') {
              const imgs = (p.images || []).map(img => {
                const cap = img.caption ? `<figcaption class="mt-2 font-mono text-[10px] text-gray-500 text-center">${img.caption}</figcaption>` : '';
                return `<figure><img src="${img.src}" alt="${img.alt || ''}" class="w-full h-64 object-contain bg-black/40 rounded-sm border border-border-dim" loading="lazy">${cap}</figure>`;
              }).join('');
              return `<div class="my-8 grid grid-cols-1 md:grid-cols-2 gap-4">${imgs}</div>`;
            }
            return '';
          }).join('');
          // Legacy quote field (renders at end if present)
          const quoteHtml = item.quote ? `
            <blockquote class="my-8 pl-6 border-l-2 border-acid/50 italic text-gray-400">
              "${item.quote}"
            </blockquote>
          ` : '';

          return `
            <article class="writing-section glass-panel p-8 rounded-sm hover:border-acid/30 transition-all" id="${item.id}">
              <div class="flex items-center gap-4 mb-4">
                <span class="font-mono text-acid text-sm">${String(index + 1).padStart(2, '0')}.</span>
                <span class="font-mono text-xs text-gray-500 border border-gray-700 px-2 py-0.5">TXT</span>
                <span class="font-mono text-xs text-gray-500">${formatDate(item.date)}</span>
                ${item.draft ? `<span class="font-mono text-[10px] uppercase tracking-wider text-gray-500 border border-gray-700 px-2 py-0.5">draft</span>` : ''}
              </div>
              <h2 class="font-display text-2xl md:text-3xl font-bold mb-2 group-hover:text-acid">${item.title}</h2>
              <p class="font-mono text-sm text-gray-500 mb-6">${item.description}</p>
              <div class="font-sans text-gray-300 leading-relaxed">
                ${bodyHtml}
                ${quoteHtml}
              </div>
            </article>
          `;
        }).join('');

        // Initialize scroll effects after content is rendered
        initScrollEffects();

        // Handle hash navigation (from homepage links)
        if (window.location.hash) {
          setTimeout(() => {
            const targetId = window.location.hash.substring(1);
            const target = document.getElementById(targetId);
            if (target) {
              const headerOffset = 120;
              const elementPosition = target.getBoundingClientRect().top;
              const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
              window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
            }
          }, 200);
        }
      }

      // Load writings from config.json - no fallbacks, no localStorage nonsense
      function loadWritings() {
        // If config already loaded, use it
        if (window.SITE_CONFIG && window.SITE_CONFIG.writings && window.SITE_CONFIG.writings.length > 0) {
          console.log('[Writings] Loaded from SITE_CONFIG:', window.SITE_CONFIG.writings.length, 'articles');
          renderWritings(window.SITE_CONFIG.writings);
          return;
        }

        // Otherwise wait for config to load
        console.log('[Writings] Waiting for config...');
        window.addEventListener('configLoaded', (e) => {
          const config = e.detail;
          if (config && config.writings && config.writings.length > 0) {
            console.log('[Writings] Config loaded:', config.writings.length, 'articles');
            renderWritings(config.writings);
          } else {
            console.error('[Writings] Config loaded but no writings found');
            document.getElementById('writings-articles').innerHTML = '<p class="text-gray-500 font-mono">Failed to load writings from config.json</p>';
          }
        });

        // Timeout - if config doesn't load in 5 seconds, show error
        setTimeout(() => {
          if (!window.SITE_CONFIG || !window.SITE_CONFIG.writings) {
            console.error('[Writings] Config failed to load');
            document.getElementById('writings-articles').innerHTML = '<p class="text-gray-500 font-mono">Failed to load writings from config.json</p>';
          }
        }, 5000);
      }

      loadWritings();

      function initScrollEffects() {
        const navLinks = document.querySelectorAll('.nav-link-item');
        const sections = document.querySelectorAll('.writing-section');
        const intro = document.querySelector('.writings-intro');

        // Reveal on scroll using Intersection Observer
        const revealObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
            }
          });
        }, {
          threshold: 0.1,
          rootMargin: '0px 0px -10% 0px'
        });

        // Observe intro and sections
        if (intro) revealObserver.observe(intro);
        sections.forEach(section => revealObserver.observe(section));

        // Scroll spy - highlight active nav item
        const spyObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              const id = entry.target.getAttribute('id');

              // Update nav links
              navLinks.forEach(link => {
                link.classList.remove('is-active');
                if (link.getAttribute('href') === `#${id}`) {
                  link.classList.add('is-active');
                }
              });
            }
          });
        }, {
          threshold: 0,
          rootMargin: '-20% 0px -60% 0px'
        });

        // Observe sections for scroll spy
        sections.forEach(section => spyObserver.observe(section));

        // Smooth scroll on nav click
        navLinks.forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = link.getAttribute('href').substring(1);
            const target = document.getElementById(targetId);

            if (target) {
              const headerOffset = 120;
              const elementPosition = target.getBoundingClientRect().top;
              const offsetPosition = elementPosition + window.pageYOffset - headerOffset;

              window.scrollTo({
                top: offsetPosition,
                behavior: 'smooth'
              });

              // Update URL hash without scrolling
              history.pushState(null, null, `#${targetId}`);
            }
          });
        });

        // Trigger initial reveal for elements in view
        setTimeout(() => {
          if (intro) {
            const introRect = intro.getBoundingClientRect();
            if (introRect.top < window.innerHeight) {
              intro.classList.add('is-visible');
            }
          }

          sections.forEach(section => {
            const rect = section.getBoundingClientRect();
            if (rect.top < window.innerHeight) {
              section.classList.add('is-visible');
            }
          });
        }, 100);
      }
    })();
  </script>

  <!-- studio ground selector -->
  <div class="colophon ground-mount"></div>
</body>
</html>
