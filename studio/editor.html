<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>notes editor · STUDIO</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem("studio.theme")||"cream"}catch(e){}</script>
<link rel="stylesheet" href="assets/catalogue.css" />
<script src="assets/graphite.js" defer></script>
<script src="assets/theme.js" defer></script>
<style>
  .ed-head { display: flex; justify-content: space-between; align-items: baseline; gap: 18px;
    padding: 26px 0 12px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  .ed-head h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 5vw, 46px); }
  .ed-actions { display: flex; gap: 10px; align-items: center; }
  .ed-btn { font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: lowercase;
    border: 1px solid var(--ink); background: none; color: var(--ink); padding: 9px 16px; cursor: pointer; }
  .ed-btn:hover { border-color: var(--sanguine); color: var(--sanguine); }
  .ed-btn.primary { background: var(--sanguine); border-color: var(--sanguine); color: var(--paper); }
  .save-state { font-family: var(--font-mono); font-size: 9px; letter-spacing: .12em; color: var(--ink-faint); }

  .ed-sect { font-family: var(--font-mono); font-size: 11px; letter-spacing: .26em; text-transform: lowercase;
    color: var(--sanguine); margin: 52px 0 6px; border-bottom: 1px solid var(--ink); padding-bottom: 8px;
    display: flex; justify-content: space-between; }
  .ed-item { margin: 26px 0; }
  .ed-label { display: flex; gap: 12px; align-items: baseline; margin-bottom: 8px; flex-wrap: wrap; }
  .ed-label .nm { font-family: var(--font-display); font-size: 21px; }
  .ed-label .ed-no { font-family: var(--font-mono); font-size: 10px; color: var(--sanguine); letter-spacing: .12em; }
  .ed-label .dirty { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .18em; color: var(--sanguine);
    border: 1px dashed var(--sanguine); padding: 2px 7px; text-transform: lowercase; display: none; }
  .ed-item.is-dirty .dirty { display: inline-block; }
  .ed-label .chars { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); margin-left: auto; }
  .ok-wrap { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: lowercase;
    color: var(--ink-faint); display: flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
  .ok-wrap input { accent-color: var(--sanguine); }
  textarea.ed-text {
    width: 100%; min-height: 84px; resize: vertical; background: var(--paper-deep);
    border: 1px solid var(--rule); color: var(--ink); padding: 14px 16px;
    font-family: var(--font-text); font-size: 16px; line-height: 1.7;
  }
  textarea.ed-text:focus { outline: 1px solid var(--sanguine); outline-offset: -1px; }
  .ed-note-hint { font-family: var(--font-mono); font-size: 8.5px; color: var(--ink-faint); letter-spacing: .08em; margin-top: 5px; }

  .ed-item.is-final .ed-text, .ed-item.is-final .rev-panel { display: none; }
  .ed-item.is-final { margin: 10px 0; opacity: .62; }
  .ed-item.is-final .ed-label { margin-bottom: 0; cursor: pointer; }
  .ed-item.is-final .nm { font-size: 16px; }
  .ed-item.is-final .nm::after { content: "  ✓ final — click to reopen"; font-family: var(--font-mono);
    font-size: 8.5px; letter-spacing: .16em; color: var(--sanguine); text-transform: lowercase; }
  .rev-panel { margin-top: 10px; border: 1px dashed var(--sanguine); background: var(--paper); padding: 12px 16px 14px; }
  .rev-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .rev-head .t { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .22em; text-transform: lowercase; color: var(--sanguine); }
  .rev-use { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .14em; text-transform: lowercase;
    border: 1px solid var(--sanguine); background: none; color: var(--sanguine); padding: 4px 10px; cursor: pointer; }
  .rev-use:hover { background: var(--sanguine); color: var(--paper); }
  .rev-text { font-family: var(--font-text); font-size: 15.5px; line-height: 1.7; }
  .rev-text mark { background: rgba(var(--sang-rgb), 0.16); color: inherit; padding: 0 1px; border-bottom: 1px solid var(--sanguine); }
  .rev-comment { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--rule-faint);
    font-family: var(--font-mono); font-size: 9.5px; line-height: 1.65; color: var(--ink-soft); letter-spacing: .03em; }
  .rev-comment::before { content: "CLAUDE — "; color: var(--sanguine); letter-spacing: .18em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="ed-head">
    <h1>Notes editor</h1>
    <div class="ed-actions">
      <span class="save-state" id="save-state">—</span>
      <button class="ed-btn" id="revert">discard edits</button>
      <button class="ed-btn primary" id="save">save draft for claude</button>
    </div>
  </header>
  <p style="font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);margin-top:10px;line-height:1.7">
    Edit any text below. Autosaves to this browser as you type; <b>SAVE DRAFT</b> writes a file Claude can read for the
    feedback loop. Tick <b>final</b> on pieces whose wording is done — applied edits with that tick also clear the draft flag on the site.
  </p>
  <main id="main"></main>
  <footer class="colophon"><span>Conrad House</span><a href="./">studio</a></footer>
</div>

<script>
const LS_KEY = "studio.notes-editor.v1";
const SAVE_URL = "http://localhost:8095/api/save";
let data = null, edits = {};        // edits: {kind:intro|series|work, id, text, final}

let suggestions = {};
(async function () {
  const r = await fetch("data/studio.json", { cache: "no-store" });
  data = await r.json();
  try { edits = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (_) { edits = {}; }
  suggestions = await fetch("data/note-suggestions.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  // recover your saved draft if this browser's local edits are missing
  try {
    const base = "http://localhost:8095/notes-editor/exports/drafts/";
    const man = await fetch(base + "manifest.json", { cache: "no-store" }).then(r => r.ok ? r.json() : null);
    const latest = man && man.saves && man.saves.length ? man.saves[man.saves.length - 1].filename : "notes-draft.txt";
    const d = await fetch(base + latest, { cache: "no-store" }).then(r => r.ok ? r.json() : null);
    if (d && d.edits) for (const [k, v] of Object.entries(d.edits)) if (!edits[k]) edits[k] = v;
  } catch (_) {}
  render();
})();

// word-level diff: mark words in the revision that aren't in your text (LCS)
function diffMark(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  const aw = A.filter(x => !/^\s*$/.test(x)), bw = B.filter(x => !/^\s*$/.test(x));
  const m = aw.length, n = bw.length;
  const L = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
    L[i][j] = aw[i] === bw[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const common = new Set();
  let i = 0, j = 0;
  while (i < m && j < n) {
    if (aw[i] === bw[j]) { common.add(j); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) i++;
    else j++;
  }
  let out = "", wi = 0;
  for (const tok of B) {
    if (/^\s*$/.test(tok)) { out += esc(tok); continue; }
    out += common.has(wi) ? esc(tok) : "<mark>" + esc(tok) + "</mark>";
    wi++;
  }
  return out;
}

function keyOf(kind, id) { return kind + ":" + id; }
function currentText(kind, id) {
  const k = keyOf(kind, id);
  if (edits[k] && edits[k].text != null) return edits[k].text;
  if (kind === "intro") return data.intro || "";
  if (kind === "series") return (data.series.find(s => s.id === id) || {}).note || "";
  const w = data.works.find(w => w.slug === id);
  return w ? w.note || "" : "";
}
function origText(kind, id) {
  if (kind === "intro") return data.intro || "";
  if (kind === "series") return (data.series.find(s => s.id === id) || {}).note || "";
  const w = data.works.find(w => w.slug === id);
  return w ? w.note || "" : "";
}

function item(kind, id, label, sub) {
  const k = keyOf(kind, id);
  const txt = currentText(kind, id);
  const dirty = txt !== origText(kind, id);
  const fin = edits[k] && edits[k].final;
  return `<div class="ed-item ${dirty ? "is-dirty" : ""} ${fin ? "is-final" : ""}" data-k="${k}">
    <div class="ed-label">
      <span class="nm">${esc(label)}</span>
      ${sub ? `<span class="ed-no">${esc(sub)}</span>` : ""}
      <span class="dirty">edited</span>
      <label class="ok-wrap"><input type="checkbox" class="fin" ${fin ? "checked" : ""}/> final</label>
      <span class="chars">${txt.length}</span>
    </div>
    <textarea class="ed-text" spellcheck="true">${esc(txt)}</textarea>
    ${suggestions[k] ? `<div class="rev-panel">
      <div class="rev-head"><span class="t">suggested revision — changes highlighted</span>
        <button class="rev-use" type="button">use revision</button></div>
      <div class="rev-text">${diffMark(txt, suggestions[k].suggested)}</div>
      ${suggestions[k].comment ? `<div class="rev-comment">${esc(suggestions[k].comment)}</div>` : ""}
    </div>` : ""}
  </div>`;
}

function render() {
  const secs = data.series || [];
  const tops = data.works.filter(w => !w.parent);
  const kidsOf = slug => data.works.filter(w => w.parent === slug).sort((a, b) => (a.edition ?? 999) - (b.edition ?? 999));
  const byS = id => tops.filter(w => w.series === id).sort((a, b) => (a.edition ?? 999) - (b.edition ?? 999));
  const expl = tops.filter(w => w.kind === "exploration");
  const singles = tops.filter(w => !w.series && w.kind !== "exploration");
  let html = `<div class="ed-sect">FRONT MATTER</div>` + item("intro", "intro", "Site intro", "one line");
  for (const s of secs) {
    html += `<div class="ed-sect">${esc(s.numeral)} · ${esc(s.name).toUpperCase()}<span>series note + works</span></div>`;
    html += item("series", s.id, s.name + " — series note", "");
    for (const w of byS(s.id)) {
      html += item("work", w.slug, w.name, w.edition != null ? "ED. " + String(w.edition).padStart(2, "0") : "✦");
      for (const c of kidsOf(w.slug)) html += item("work", c.slug, c.name, "substudy of " + w.name + (c.edition != null ? " · ED. " + String(c.edition).padStart(2, "0") : ""));
    }
  }
  if (expl.length) { html += `<div class="ed-sect">◎ EXPLORATIONS</div>`; for (const w of expl) html += item("work", w.slug, w.name, "✦"); }
  if (singles.length) { html += `<div class="ed-sect">· SINGLE WORKS</div>`; for (const w of singles) html += item("work", w.slug, w.name, w.edition != null ? "ED. " + String(w.edition).padStart(2, "0") : "✦"); }
  document.getElementById("main").innerHTML = html;

  document.querySelectorAll(".ed-item").forEach(el => {
    const k = el.dataset.k;
    const ta = el.querySelector("textarea");
    const autofit = () => { ta.style.height = "auto"; ta.style.height = (ta.scrollHeight + 4) + "px"; };
    autofit();
    ta.addEventListener("input", () => {
      const [kind, ...rest] = k.split(":"); const id = rest.join(":");
      edits[k] = edits[k] || {}; edits[k].text = ta.value;
      if (ta.value === origText(kind, id)) delete edits[k].text;
      if (edits[k] && edits[k].text == null && !edits[k].final) delete edits[k];
      persist();
      el.classList.toggle("is-dirty", ta.value !== origText(kind, id));
      el.querySelector(".chars").textContent = ta.value.length;
      autofit();
    });
    const useBtn = el.querySelector(".rev-use");
    if (useBtn) useBtn.addEventListener("click", () => {
      ta.value = suggestions[k].suggested;
      ta.dispatchEvent(new Event("input", { bubbles: true }));
    });
    el.querySelector(".fin").addEventListener("change", e => {
      edits[k] = edits[k] || {}; edits[k].final = e.target.checked;
      if (!edits[k].final && edits[k].text == null) delete edits[k];
      persist();
      el.classList.toggle("is-final", e.target.checked);
    });
    el.querySelector(".ed-label").addEventListener("click", e => {
      if (e.target.closest(".ok-wrap")) return;
      if (el.classList.contains("is-final")) { el.classList.remove("is-final"); autofit(); }
    });
  });
  if (window.Graphite) Graphite.init(); else addEventListener("load", () => Graphite.init());
}

function persist() {
  localStorage.setItem(LS_KEY, JSON.stringify(edits));
  document.getElementById("save-state").textContent = "autosaved " + new Date().toLocaleTimeString();
}

document.getElementById("revert").onclick = () => {
  if (!confirm("Discard all local edits and reload the live text?")) return;
  edits = {}; persist(); render();
};

document.getElementById("save").onclick = async () => {
  const payload = { savedAt: new Date().toISOString(), edits: {} };
  for (const [k, v] of Object.entries(edits)) payload.edits[k] = v;
  const body = {
    project: "notes-editor", variation: "drafts",
    filename: "notes-draft.txt", format: "txt",
    content: JSON.stringify(payload, null, 2),
    meta: { count: Object.keys(payload.edits).length },
  };
  const btn = document.getElementById("save");
  btn.textContent = "saving…";
  try {
    const r = await fetch(SAVE_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error("HTTP " + r.status);
    btn.textContent = "saved ✓";
    document.getElementById("save-state").textContent = Object.keys(payload.edits).length + " item(s) in draft — tell claude to read it";
  } catch (e) {
    btn.textContent = "save failed — is the studio server on :8095 running?";
  }
  setTimeout(() => btn.textContent = "save draft for claude", 2600);
};

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
</body>
</html>
