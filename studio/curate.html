<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>image curation · STUDIO</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
/* self-hosted fonts (no CDN) */
@font-face { font-family: "Happy Times"; src: url("../assets/catalogue/fonts/HappyTimes-regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Happy Times"; src: url("../assets/catalogue/fonts/HappyTimes-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Happy Times"; src: url("../assets/catalogue/fonts/HappyTimes-bold.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "Routed Gothic"; src: url("../assets/catalogue/fonts/routed-gothic.ttf") format("truetype"); font-weight: 400; font-style: normal; font-display: swap; }

:root {
  --paper: rgb(231,228,221);
  --paper-deep: rgb(222,218,209);
  --ink: #1c1a16;
  --ink-soft: #4a463f;
  --ink-faint: #8b857a;
  --rule: rgba(28,26,22,.22);
  --rule-faint: rgba(28,26,22,.1);
  --sanguine: #9c3d1e;
  --font-display: "Happy Times", georgia, serif;
  --font-mono: "Routed Gothic", ui-monospace, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-display); font-size: 15px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
button, input, select, textarea { font-family: inherit; color: inherit; }
.mono { font-family: var(--font-mono); text-transform: lowercase; letter-spacing: .1em; }

/* ---------- top bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 40; background: var(--paper);
  border-bottom: 2px solid var(--ink);
  display: flex; align-items: center; gap: 16px;
  padding: 12px clamp(14px, 2vw, 26px); flex-wrap: wrap;
}
.bar h1 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.bar h1 span { color: var(--sanguine); }
.bar .spacer { flex: 1; }
.state {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
  text-transform: lowercase; color: var(--ink-faint);
}
.state.dirty { color: var(--sanguine); }
.btn {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: .18em; text-transform: lowercase;
  border: 1px solid var(--ink); background: none; color: var(--ink);
  padding: 8px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--sanguine); color: var(--sanguine); }
.btn.primary { background: var(--sanguine); border-color: var(--sanguine); color: var(--paper); }
.btn.primary:hover { color: var(--paper); opacity: .9; }
.hint {
  width: 100%; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .06em;
  text-transform: lowercase; color: var(--ink-faint); margin-top: 2px;
}
.hint b { color: var(--ink-soft); }

.restore {
  background: var(--paper-deep); border-bottom: 1px solid var(--sanguine);
  padding: 8px clamp(14px, 2vw, 26px); font-family: var(--font-mono);
  font-size: 10px; letter-spacing: .06em; text-transform: lowercase; color: var(--sanguine);
  display: flex; gap: 14px; align-items: center;
}

/* ---------- layout ---------- */
.shell { display: flex; align-items: stretch; min-height: calc(100vh - 52px); }
.side {
  width: 300px; flex: none; border-right: 2px solid var(--ink);
  padding: 14px 0 60px; overflow-y: auto; height: calc(100vh - 52px);
  position: sticky; top: 52px;
}
.main { flex: 1; min-width: 0; padding: 22px clamp(16px, 2.4vw, 40px) 120px; }

/* side list */
.s-series { margin: 8px 0 2px; padding: 8px 20px 6px; border-bottom: 1px solid var(--rule); }
.s-series .num { font-family: var(--font-mono); font-size: 10px; color: var(--sanguine); letter-spacing: .12em; }
.s-series .nm { font-family: var(--font-display); font-size: 16px; }
.s-work {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  border: 0; background: none; cursor: pointer;
  padding: 6px 20px 6px 20px; border-left: 3px solid transparent;
}
.s-work.sub { padding-left: 38px; }
.s-work:hover { background: var(--paper-deep); }
.s-work.cur { border-left-color: var(--sanguine); background: var(--paper-deep); }
.s-work .ed { font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .1em; width: 30px; flex: none; }
.s-work .wn { font-family: var(--font-display); font-size: 15px; line-height: 1.15; }
.s-work.cur .wn { color: var(--sanguine); }
.s-work .ct { margin-left: auto; font-family: var(--font-mono); font-size: 9px; color: var(--ink-faint); letter-spacing: .08em; flex: none; }
.s-work.zero .ct { color: var(--sanguine); font-weight: bold; }

/* ---------- work editor ---------- */
.w-head { border-bottom: 2px solid var(--ink); padding-bottom: 14px; margin-bottom: 6px; }
.w-kicker { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; text-transform: lowercase; color: var(--sanguine); margin-bottom: 8px; display: flex; gap: 14px; flex-wrap: wrap; }
.w-kicker .zeroflag { color: var(--sanguine); border: 1px dashed var(--sanguine); padding: 1px 7px; }
.title-in {
  font-family: var(--font-display); font-weight: 400; font-size: clamp(28px, 4vw, 44px);
  background: none; border: 0; border-bottom: 1px dashed transparent; width: 100%;
  padding: 2px 0; letter-spacing: .01em;
}
.title-in:hover { border-bottom-color: var(--rule); }
.title-in:focus { outline: 0; border-bottom-color: var(--sanguine); }
.field-note { font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; text-transform: lowercase; color: var(--ink-faint); margin-top: 4px; }

.tray-toggle {
  margin: 18px 0 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .16em;
  text-transform: lowercase; color: var(--sanguine); background: none; border: 1px solid var(--rule);
  padding: 7px 14px; cursor: pointer;
}
.tray-toggle:hover { border-color: var(--sanguine); }
.tray { display: none; border: 1px dashed var(--sanguine); background: var(--paper-deep); padding: 12px; margin-bottom: 10px; }
.tray.open { display: block; }
.tray .t { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em; text-transform: lowercase; color: var(--ink-soft); margin-bottom: 8px; }
.tray-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.tray-item {
  border: 1px solid var(--rule); background: var(--paper); cursor: pointer;
  width: 92px; padding: 4px; text-align: center;
}
.tray-item:hover { border-color: var(--sanguine); }
.tray-item .th { width: 84px; height: 62px; object-fit: cover; background: var(--paper-deep); display: block; }
.tray-item .vchip { width: 84px; height: 62px; display: flex; align-items: center; justify-content: center; background: var(--ink); color: var(--paper); font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; }
.tray-item .fn { font-family: var(--font-mono); font-size: 8px; letter-spacing: .02em; color: var(--ink-soft); word-break: break-all; margin-top: 3px; }
.tray-empty { font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); letter-spacing: .06em; }

/* image cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 14px; }
.card { border: 1px solid var(--rule); background: var(--paper-deep); padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.grip { position: absolute; top: 8px; right: 9px; z-index: 3; cursor: grab; color: var(--ink-faint);
  font-size: 12px; letter-spacing: -1px; line-height: 1; padding: 2px; user-select: none; }
.grip:hover { color: var(--sanguine); }
.grip:active { cursor: grabbing; }
.card.dragging { opacity: .4; }
.card[data-drop="before"] { box-shadow: inset 0 3px 0 0 var(--sanguine); }
.card[data-drop="after"] { box-shadow: inset 0 -3px 0 0 var(--sanguine); }
.card.is-header { border: 2px solid var(--sanguine); }
.card .idx { position: absolute; top: 6px; left: 8px; z-index: 3; font-family: var(--font-mono); font-size: 9px; letter-spacing: .1em; color: var(--paper); background: rgba(28,26,22,.72); padding: 1px 6px; }
.card .badges { position: absolute; top: 6px; right: 8px; z-index: 3; display: flex; gap: 4px; }
.card .badge { font-family: var(--font-mono); font-size: 8px; letter-spacing: .12em; text-transform: uppercase; padding: 2px 6px; color: var(--paper); background: var(--sanguine); }
.card .badge.thumb { background: var(--ink); }
.card .badge.trip { background: #2f5d50; }
.frame { border: 1px solid var(--rule); background: var(--paper); aspect-ratio: 4/3; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.frame img { width: 100%; height: 100%; object-fit: contain; }
.frame .vid { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: lowercase; color: var(--ink-faint); }
.frame .vid .big { font-size: 22px; color: var(--ink-soft); }
.fname { font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .04em; color: var(--ink-soft); word-break: break-all; }
.fname .dim { color: var(--ink-faint); }

.lab { font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .12em; text-transform: lowercase; color: var(--ink-faint); display: block; margin-bottom: 2px; }
.tin, .cin {
  width: 100%; background: var(--paper); border: 1px solid var(--rule); color: var(--ink);
  padding: 6px 8px; font-family: var(--font-display); font-size: 14px;
}
.tin:focus, .cin:focus { outline: 1px solid var(--sanguine); outline-offset: -1px; }

.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--rule-faint); padding-top: 8px; }
.tog {
  font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .12em; text-transform: uppercase;
  border: 1px solid var(--rule); background: var(--paper); color: var(--ink-soft);
  padding: 5px 8px; cursor: pointer;
}
.tog:hover { border-color: var(--sanguine); }
.tog.on { background: var(--sanguine); border-color: var(--sanguine); color: var(--paper); }
.tog.on.thumb { background: var(--ink); border-color: var(--ink); }
.trip-sel { font-family: var(--font-mono); font-size: 10px; padding: 4px 4px; background: var(--paper); border: 1px solid var(--rule); }
.mv { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; width: 26px; height: 26px; line-height: 1; }
.mv:hover:not(:disabled) { border-color: var(--sanguine); color: var(--sanguine); }
.mv:disabled { opacity: .3; cursor: default; }
.rm { margin-left: auto; font-family: var(--font-mono); font-size: 14px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink-soft); cursor: pointer; width: 26px; height: 26px; line-height: 1; }
.rm:hover { border-color: var(--sanguine); color: var(--sanguine); }

.empty-work { font-family: var(--font-mono); font-size: 12px; color: var(--sanguine); letter-spacing: .06em; text-transform: lowercase; border: 1px dashed var(--sanguine); padding: 18px; margin-top: 20px; }
.placeholder { color: var(--ink-faint); font-style: italic; padding: 60px 10px; }
/* drag-and-drop new images */
.dropzone { margin-top: 10px; border: 1px dashed var(--rule); background: var(--paper);
  padding: 16px 14px; text-align: center; cursor: pointer; display: flex; flex-direction: column; gap: 5px;
  transition: border-color .15s ease, background .15s ease; }
.dropzone:hover { border-color: var(--sanguine); }
.dropzone.over { border-color: var(--sanguine); border-style: solid; background: var(--paper-deep); }
.dz-big { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: lowercase; color: var(--ink); }
.dz-sub { font-family: var(--font-mono); font-size: 9px; letter-spacing: .04em; color: var(--ink-faint); }
.badge.staged { background: #7a5a1e; }
.badge.new { background: #7a5a1e; }
.mv.dl { border-color: var(--sanguine); color: var(--sanguine); white-space: nowrap; }
.mv.dl:hover { background: var(--sanguine); color: var(--paper); }
.staged-note { margin: 12px 0 4px; border-left: 2px solid #7a5a1e; padding: 8px 12px;
  background: var(--paper-deep); font-family: var(--font-mono); font-size: 10px; line-height: 1.6;
  letter-spacing: .02em; color: var(--ink-soft); }
.staged-note b { color: var(--ink); }
.main.drag { outline: 2px dashed var(--sanguine); outline-offset: -6px; }

/* preview modal — how the work lays out on its piece page */
.pv-modal { position: fixed; inset: 0; z-index: 200; background: var(--paper); display: flex; flex-direction: column; }
.pv-modal[hidden] { display: none; }
.pv-head { display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 11px 20px; border-bottom: 1px solid var(--ink); background: var(--paper); flex: 0 0 auto; }
.pv-title { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; color: var(--ink-faint); text-transform: lowercase; }
.pv-doc { flex: 1 1 auto; overflow-y: auto; width: 100%; max-width: 1160px; margin: 0 auto; padding: 26px clamp(16px,4vw,54px) 120px; }
.pv-note { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; color: var(--ink-faint); text-transform: lowercase; margin-bottom: 18px; max-width: 640px; line-height: 1.6; }
.pv-h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(28px,5vw,50px); margin: 0 0 4px; }
.pv-hero { margin: 20px 0 8px; }
.pv-hero .pv-fig { width: fit-content; max-width: 100%; margin: 0 auto; }
.pv-hero .pv-fig img { width: auto; max-width: 100%; max-height: 74vh; }
.pv-row { display: grid; gap: 16px; margin: 16px 0; }
.pv-fig { position: relative; border: 1px solid var(--rule); background: var(--paper-deep); }
.pv-fig img { display: block; width: 100%; height: auto; }
.pv-cap { font-family: var(--font-mono); font-size: 9px; letter-spacing: .04em; color: var(--ink-faint); padding: 7px 5px; }
.pv-cap .seed { color: var(--ink-soft); font-style: italic; }
.pv-tags { position: absolute; top: 6px; left: 6px; z-index: 2; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; pointer-events: none; }
.pv-tag { font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em; text-transform: lowercase; padding: 2px 6px; background: var(--sanguine); color: var(--paper); }
.pv-tag.thumb { background: var(--ink); }
.pv-tag.trip { background: #2f5d50; }
.pv-vid { min-height: 160px; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-family: var(--font-mono); font-size: 11px; }
@media (max-width: 640px) { .pv-row { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
  <div class="bar">
    <h1>studio · <span>image curation</span></h1>
    <span class="spacer"></span>
    <span class="state mono" id="state">loading…</span>
    <button class="btn" id="preview" disabled>preview layout</button>
    <button class="btn" id="copy">copy json</button>
    <button class="btn primary" id="export">export studio.json</button>
    <p class="hint"><b>download this and replace studio/data/studio.json, or tell Claude to apply it.</b> new fields written: <b>lead</b> + <b>thumb</b> on a work, <b>trip</b> on grouped images. all other fields left untouched.</p>
  </div>
  <div class="restore" id="restore" style="display:none">
    <span id="restore-msg"></span>
    <button class="btn" id="restore-discard">discard local edits, reload file</button>
  </div>

  <div class="shell">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"><p class="placeholder">select a work from the left.</p></main>
  </div>

  <div class="pv-modal" id="pv-modal" hidden>
    <div class="pv-head">
      <span class="pv-title mono" id="pv-title">preview</span>
      <button class="btn" id="pv-close">close ✕</button>
    </div>
    <div class="pv-doc" id="pv-doc"></div>
  </div>

<script>
"use strict";
const LS_KEY = "studio.curate.v1";
const SAVE_URL = "http://localhost:8095/api/save";
const IMG_BASE = "assets/img/";        // relative to studio/curate.html
const VIDEO_RE = /\.(mp4|webm|mov|m4v)$/i;

let data = null;         // working copy (mutated)
let pristine = null;     // exact file as loaded, for dirty compare
let manifest = {};       // slug -> [files on disk]
let curSlug = null;
let trayOpen = false;
let dragFrom = null;                  // index of the card currently being drag-reordered
const staged = Object.create(null);   // "slug/file" -> dataURL for images dropped this session (not yet on disk)

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const isVideo = im => im.video === true || VIDEO_RE.test(im.file || "");
const clone = o => JSON.parse(JSON.stringify(o));
const stageKey = (slug, file) => slug + "/" + file;
const isStaged = (slug, file) => !!staged[stageKey(slug, file)];
const srcFor = (slug, file) => staged[stageKey(slug, file)] || (IMG_BASE + slug + "/" + file);

/* ---------- load ---------- */
(async function () {
  try {
    const [sj, mj] = await Promise.all([
      fetch("data/studio.json", { cache: "no-store" }).then(r => r.json()),
      fetch("data/img-manifest.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
    ]);
    pristine = clone(sj);
    manifest = mj || {};
    // recover unsaved local edits if present
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (_) {}
    if (saved && saved.data) {
      data = saved.data;
      const bar = $("#restore");
      bar.style.display = "flex";
      $("#restore-msg").textContent = "restored unsaved edits from " + (saved.at ? new Date(saved.at).toLocaleString() : "an earlier session") + ".";
    } else {
      data = clone(sj);
    }
    // self-heal stale refs: an image staged last session (bytes gone) but since
    // saved to disk under a different extension (png→jpg) would 404. remap any
    // ref that isn't on disk to its on-disk sibling of the same name.
    const healed = healRefs();
    if (healed) { persist(); }
  } catch (e) {
    $("#main").innerHTML = '<div class="empty-work">could not load data/studio.json — ' + esc(e.message) + '</div>';
    return;
  }
  renderSide();
  updateState();
})();

/* ---------- self-heal stale image refs ---------- */
const stemOf = f => String(f || "").replace(/\.[^.]+$/, "");
function healRefs() {
  let n = 0;
  (data.works || []).forEach(w => {
    const disk = manifest[w.slug] || [];
    const bystem = {};
    disk.forEach(f => { bystem[stemOf(f).toLowerCase()] = f; });
    const fix = f => {
      if (!f || isStaged(w.slug, f) || disk.includes(f)) return f;  // in memory or on disk as-is
      const alt = bystem[stemOf(f).toLowerCase()];                  // same name, different ext
      if (alt && alt !== f) { n++; return alt; }
      return f;
    };
    (w.images || []).forEach(im => { im.file = fix(im.file); });
    if (w.thumb) w.thumb = fix(w.thumb);
    if (w.lead) w.lead = fix(w.lead);
  });
  return n;
}

/* ---------- dirty / persist ---------- */
function isDirty() { return JSON.stringify(data) !== JSON.stringify(pristine); }
function updateState() {
  const el = $("#state");
  if (isDirty()) { el.textContent = "unsaved changes"; el.classList.add("dirty"); }
  else { el.textContent = "no changes since load"; el.classList.remove("dirty"); }
}
function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ at: Date.now(), data })); } catch (_) {}
}
function touched() { persist(); updateState(); }

/* ---------- work ordering helpers ---------- */
const ordKey = w => (w.order != null ? w.order : (w.edition != null ? w.edition : 9999));
function topWorksIn(seriesId) {
  return data.works.filter(w => !w.parent && w.series === seriesId).sort((a, b) => ordKey(a) - ordKey(b));
}
function childrenOf(slug) {
  return data.works.filter(w => w.parent === slug).sort((a, b) => ordKey(a) - ordKey(b));
}
function nonVideoCount(w) { return (w.images || []).filter(im => !isVideo(im)).length; }
function imgCount(w) { return (w.images || []).length; }

/* ---------- left list ---------- */
function renderSide() {
  const side = $("#side");
  let html = "";
  const seriesIds = new Set(data.series.map(s => s.id));

  for (const s of data.series) {
    html += `<div class="s-series"><span class="num mono">${esc(s.numeral || "")}</span> <span class="nm">${esc(s.name || s.id)}</span></div>`;
    for (const w of topWorksIn(s.id)) {
      html += workRow(w, false);
      for (const c of childrenOf(w.slug)) html += workRow(c, true);
    }
  }
  // anything not under a known series and not a child (safety net)
  const orphan = data.works.filter(w => !w.parent && !seriesIds.has(w.series));
  if (orphan.length) {
    html += `<div class="s-series"><span class="num mono">·</span> <span class="nm">unfiled</span></div>`;
    for (const w of orphan.sort((a, b) => ordKey(a) - ordKey(b))) {
      html += workRow(w, false);
      for (const c of childrenOf(w.slug)) html += workRow(c, true);
    }
  }
  side.innerHTML = html;
  side.querySelectorAll(".s-work").forEach(b => b.addEventListener("click", () => openWork(b.dataset.slug)));
}
function workRow(w, sub) {
  const n = imgCount(w);
  const ed = w.edition != null ? "ed" + String(w.edition).padStart(2, "0") : "✦";
  return `<button class="s-work ${sub ? "sub" : ""} ${curSlug === w.slug ? "cur" : ""} ${n === 0 ? "zero" : ""}" data-slug="${esc(w.slug)}">
    <span class="ed">${esc(ed)}</span>
    <span class="wn">${esc(w.name || w.slug)}</span>
    <span class="ct">${n === 0 ? "0 img" : n}</span>
  </button>`;
}

/* ---------- open a work ---------- */
function findWork(slug) { return data.works.find(w => w.slug === slug); }
function openWork(slug) {
  curSlug = slug;
  trayOpen = false;
  $("#preview").disabled = false;
  renderSide();
  renderMain();
}

/* current header file: explicit lead, else first non-video, else first */
function headerFile(w) {
  const imgs = w.images || [];
  if (w.lead && imgs.some(im => im.file === w.lead)) return w.lead;
  const nv = imgs.find(im => !isVideo(im));
  return nv ? nv.file : (imgs[0] ? imgs[0].file : null);
}
function thumbFile(w) {
  const imgs = w.images || [];
  if (w.thumb && imgs.some(im => im.file === w.thumb)) return w.thumb;
  return headerFile(w);
}
function maxTrip(w) {
  return (w.images || []).reduce((m, im) => Math.max(m, im.trip || 0), 0);
}

function renderMain() {
  const w = findWork(curSlug);
  const main = $("#main");
  if (!w) { main.innerHTML = '<p class="placeholder">select a work.</p>'; return; }

  const imgs = w.images || [];
  const hf = headerFile(w), tf = thumbFile(w);
  const seriesName = (data.series.find(s => s.id === w.series) || {}).name || w.series || "—";
  const kicker = [
    w.edition != null ? "ed. " + String(w.edition).padStart(2, "0") : "no edition",
    esc(w.kind || ""),
    "series: " + esc(seriesName),
    w.parent ? "substudy of " + esc(w.parent) : "",
    imgs.length + " image" + (imgs.length === 1 ? "" : "s"),
  ].filter(Boolean).map(t => `<span>${t}</span>`).join("");

  const unused = (manifest[w.slug] || []).filter(f => !imgs.some(im => im.file === f));

  let html = `
    <div class="w-head">
      <div class="w-kicker">${kicker}${imgs.length === 0 ? '<span class="zeroflag">no images</span>' : ""}</div>
      <input class="title-in" id="title-in" value="${esc(w.name || "")}" spellcheck="false" />
      <div class="field-note">work title · slug ${esc(w.slug)} (slug not editable here)</div>
    </div>

    <button class="tray-toggle" id="tray-toggle">${trayOpen ? "hide" : "add image"} (${unused.length} on disk unused)</button>
    <div class="tray ${trayOpen ? "open" : ""}" id="tray">
      <div class="t">files present in assets/img/${esc(w.slug)}/ not yet in this work — click to add</div>
      ${unused.length ? `<div class="tray-grid">${unused.map(trayItem(w.slug)).join("")}</div>` : '<div class="tray-empty">nothing unused on disk.</div>'}
      <div class="dropzone" id="dropzone">
        <span class="dz-big">drop new image files here — or click to choose</span>
        <span class="dz-sub">staged in your browser, previewed instantly · pngs are re-encoded to optimized jpg on drop · then use “⤓ save file” on each to place it into assets/img/${esc(w.slug)}/</span>
        <input type="file" id="dz-input" accept="image/*,video/*" multiple hidden>
      </div>
    </div>`;

  const stagedList = imgs.filter(im => isStaged(w.slug, im.file));
  if (stagedList.length) {
    html += `<div class="staged-note">${stagedList.length} staged image${stagedList.length === 1 ? "" : "s"} — held in this browser session only. to publish: click “⤓ save file” on each and drop the download into <b>assets/img/${esc(w.slug)}/</b>, then export studio.json. staged bytes are lost if you reload before saving.</div>`;
  }

  if (!imgs.length) {
    html += '<div class="empty-work">this work has no images. use “add image” above.</div>';
  } else {
    html += '<div class="grid">' + imgs.map((im, i) => card(w, im, i, hf, tf)).join("") + "</div>";
  }
  main.innerHTML = html;
  wireMain(w);
}

function trayItem(slug) {
  return f => {
    const vid = VIDEO_RE.test(f);
    const media = vid ? `<div class="vchip">video</div>` : `<img class="th" src="${IMG_BASE}${esc(slug)}/${esc(f)}" loading="lazy" alt="">`;
    return `<button class="tray-item" data-add="${esc(f)}">${media}<div class="fn">${esc(f)}</div></button>`;
  };
}

function card(w, im, i, hf, tf) {
  const imgs = w.images;
  const vid = isVideo(im);
  const src = srcFor(w.slug, im.file);
  const stagedHere = isStaged(w.slug, im.file);
  const isHead = im.file === hf;
  const isThumb = im.file === tf;
  const maxG = maxTrip(w);
  const badges = [];
  if (isHead) badges.push('<span class="badge">header</span>');
  if (isThumb) badges.push('<span class="badge thumb">thumb</span>');
  if (im.trip) badges.push(`<span class="badge trip">trip ${im.trip}</span>`);
  if (stagedHere) badges.push('<span class="badge staged">staged</span>');

  const media = vid
    ? `<div class="vid"><span class="big">▶</span><span>video</span></div>`
    : `<img src="${esc(src)}" loading="lazy" alt="">`;

  let tripOpts = '<option value="0"' + (!im.trip ? " selected" : "") + ">none</option>";
  for (let g = 1; g <= maxG + 1; g++) tripOpts += `<option value="${g}"${im.trip === g ? " selected" : ""}>trip ${g}</option>`;

  const dim = (im.w && im.h) ? ` <span class="dim">${im.w}×${im.h}</span>` : "";

  return `<div class="card ${isHead ? "is-header" : ""}" data-i="${i}">
    <span class="idx mono">${i + 1}</span>
    <span class="grip" draggable="true" title="drag to reorder" aria-label="drag to reorder">⠿⠿</span>
    <div class="badges">${badges.join("")}</div>
    <div class="frame">${media}</div>
    <div class="fname">${esc(im.file)}${dim}</div>
    <div>
      <span class="lab">seed phrase (title)</span>
      <input class="tin" data-field="title" data-i="${i}" value="${esc(im.title || "")}" placeholder="e.g. seed 195" spellcheck="false">
    </div>
    <div>
      <span class="lab">caption (machine name)</span>
      <input class="cin" data-field="caption" data-i="${i}" value="${esc(im.caption || "")}" spellcheck="false">
    </div>
    <div class="controls">
      <button class="tog ${isHead ? "on" : ""}" data-head="${i}" title="set as header / lead image">header</button>
      <button class="tog thumb ${isThumb ? "on" : ""}" data-thumb="${i}" title="set as thumbnail">thumb</button>
      <select class="trip-sel" data-trip="${i}" title="triptych group">${tripOpts}</select>
      <button class="mv" data-up="${i}" ${i === 0 ? "disabled" : ""} title="move up">↑</button>
      <button class="mv" data-down="${i}" ${i === imgs.length - 1 ? "disabled" : ""} title="move down">↓</button>
      ${stagedHere ? `<button class="mv dl" data-dl="${i}" title="download this file — save it into assets/img/${esc(w.slug)}/ to put it on disk">⤓ save file</button>` : ""}
      <button class="rm" data-rm="${i}" title="remove image">×</button>
    </div>
  </div>`;
}

/* ---------- wiring ---------- */
function wireMain(w) {
  $("#title-in").addEventListener("input", e => { w.name = e.target.value; touched(); renderSideNamesOnly(); });

  $("#tray-toggle").addEventListener("click", () => { trayOpen = !trayOpen; $("#tray").classList.toggle("open", trayOpen); $("#tray-toggle").textContent = (trayOpen ? "hide" : "add image") + " (" + (manifest[w.slug] || []).filter(f => !(w.images || []).some(im => im.file === f)).length + " on disk unused)"; });

  $("#main").querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => addImage(w, b.dataset.add)));

  // drag-and-drop / click-to-choose new images (staged in-browser)
  const dz = $("#dropzone"), dzi = $("#dz-input");
  if (dz) {
    ["dragenter", "dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dz.classList.add("over"); }));
    ["dragleave", "dragend"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); if (e.target === dz) dz.classList.remove("over"); }));
    dz.addEventListener("drop", e => { e.preventDefault(); e.stopPropagation(); dz.classList.remove("over"); handleDroppedFiles(w, e.dataTransfer.files); });
    dz.addEventListener("click", () => dzi && dzi.click());
  }
  if (dzi) dzi.addEventListener("change", () => { handleDroppedFiles(w, dzi.files); dzi.value = ""; });
  $("#main").querySelectorAll("[data-dl]").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); downloadStaged(w, +b.dataset.dl); }));

  $("#main").querySelectorAll(".tin, .cin").forEach(inp => inp.addEventListener("input", () => {
    const im = w.images[+inp.dataset.i];
    if (!im) return;
    im[inp.dataset.field] = inp.value;
    touched();
  }));

  $("#main").querySelectorAll("[data-head]").forEach(b => b.addEventListener("click", () => setHeader(w, +b.dataset.head)));
  $("#main").querySelectorAll("[data-thumb]").forEach(b => b.addEventListener("click", () => setThumb(w, +b.dataset.thumb)));
  $("#main").querySelectorAll("[data-trip]").forEach(sel => sel.addEventListener("change", () => setTrip(w, +sel.dataset.trip, +sel.value)));
  $("#main").querySelectorAll("[data-up]").forEach(b => b.addEventListener("click", () => move(w, +b.dataset.up, -1)));
  $("#main").querySelectorAll("[data-down]").forEach(b => b.addEventListener("click", () => move(w, +b.dataset.down, +1)));
  $("#main").querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => removeImage(w, +b.dataset.rm)));

  // drag-and-drop reordering (grab the ⠿ grip and drop between cards)
  const cards = Array.from($("#main").querySelectorAll(".card"));
  const clearDrop = () => cards.forEach(c => c.removeAttribute("data-drop"));
  cards.forEach(cardEl => {
    const grip = cardEl.querySelector(".grip");
    if (grip) {
      grip.addEventListener("dragstart", e => {
        dragFrom = +cardEl.dataset.i;
        cardEl.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", String(dragFrom)); } catch (_) {}
        try { e.dataTransfer.setDragImage(cardEl, 24, 20); } catch (_) {}
      });
      grip.addEventListener("dragend", () => { cardEl.classList.remove("dragging"); clearDrop(); dragFrom = null; });
    }
    cardEl.addEventListener("dragover", e => {
      if (dragFrom === null) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      const r = cardEl.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      clearDrop();
      if (+cardEl.dataset.i !== dragFrom) cardEl.setAttribute("data-drop", after ? "after" : "before");
    });
    cardEl.addEventListener("drop", e => {
      if (dragFrom === null) return;
      e.preventDefault();
      const over = +cardEl.dataset.i;
      const after = cardEl.getAttribute("data-drop") === "after";
      clearDrop();
      reorder(w, dragFrom, after ? over + 1 : over);
    });
  });
}
// update only the counts/names in the side list without stealing focus from the title input
function renderSideNamesOnly() {
  const w = findWork(curSlug);
  document.querySelectorAll(`.s-work[data-slug="${CSS.escape(curSlug)}"] .wn`).forEach(el => el.textContent = w.name || w.slug);
}

/* ---------- mutations ---------- */
function setHeader(w, i) {
  const im = w.images[i];
  if (!im) return;
  // reorder so chosen image is first + set explicit lead
  w.images.splice(i, 1);
  w.images.unshift(im);
  w.lead = im.file;
  touched(); renderMain();
}
function setThumb(w, i) {
  const im = w.images[i];
  if (!im) return;
  if (w.thumb === im.file) { delete w.thumb; }   // toggle off -> falls back to header
  else { w.thumb = im.file; }
  touched(); renderMain();
}
function setTrip(w, i, g) {
  const im = w.images[i];
  if (!im) return;
  if (g > 0) im.trip = g; else delete im.trip;
  // normalize: if a group number is now empty, that's fine — groups are free-form
  touched(); renderMain();
}
function move(w, i, dir) {
  const j = i + dir;
  if (j < 0 || j >= w.images.length) return;
  const [im] = w.images.splice(i, 1);
  w.images.splice(j, 0, im);
  touched(); renderMain();
}
// drag-reorder: move image from `from` to insertion index `to` (before-adjust for the removal)
function reorder(w, from, to) {
  const imgs = w.images;
  if (from == null || from < 0 || from >= imgs.length) return;
  const [im] = imgs.splice(from, 1);
  if (from < to) to--;
  to = Math.max(0, Math.min(to, imgs.length));
  if (to === from && imgs[to] === im) return;
  imgs.splice(to, 0, im);
  touched(); renderMain();
}
function removeImage(w, i) {
  const im = w.images[i];
  if (!im) return;
  if (!confirm("Remove " + im.file + " from " + w.name + "? (only edits studio.json, does not delete the file on disk)")) return;
  w.images.splice(i, 1);
  if (w.lead === im.file) delete w.lead;
  if (w.thumb === im.file) delete w.thumb;
  touched(); renderMain(); renderSide();
}
function addImage(w, file) {
  if ((w.images || []).some(im => im.file === file)) return;
  w.images = w.images || [];
  const rec = { file, caption: "", title: "" };
  if (VIDEO_RE.test(file)) rec.video = true;
  w.images.push(rec);
  touched(); renderMain(); renderSide();
  // best-effort: fill w/h by loading the image (non-blocking)
  if (!rec.video) {
    const img = new Image();
    img.onload = () => {
      if (img.naturalWidth && img.naturalHeight) {
        rec.w = img.naturalWidth; rec.h = img.naturalHeight;
        touched();
        if (curSlug === w.slug) renderMain();
      }
    };
    img.src = IMG_BASE + w.slug + "/" + file;
  }
}

/* ---------- drag-and-drop: stage new images (not yet on disk) ---------- */
function safeName(name) {
  let base = String(name || "image.jpg").toLowerCase().trim()
    .replace(/[^a-z0-9._-]+/g, "-").replace(/-+/g, "-").replace(/^[-.]+|-+$/g, "");
  if (!/\.(jpe?g|png|gif|webp|mp4|webm)$/.test(base)) base += ".jpg";
  return base || "image.jpg";
}
function uniqueName(w, name) {
  const taken = new Set([...(w.images || []).map(im => im.file), ...(manifest[w.slug] || [])]);
  let base = safeName(name);
  if (!taken.has(base)) return base;
  const dot = base.lastIndexOf("."), stem = base.slice(0, dot), ext = base.slice(dot);
  let n = 2; while (taken.has(stem + "-" + n + ext)) n++;
  return stem + "-" + n + ext;
}
function handleDroppedFiles(w, fileList) {
  const files = Array.from(fileList || []).filter(f => /^image\//.test(f.type) || /^video\//.test(f.type) || VIDEO_RE.test(f.name));
  if (!files.length) return;
  if (!trayOpen) { trayOpen = true; }   // reveal the tray so staging is visible
  files.forEach(f => addDropped(w, f));
}
// the generator exports heavy PNGs (~7MB); the site wants light JPEGs. so on
// stage we re-encode any non-jpeg image to an optimized jpeg right here — the
// staged bytes you save + the studio.json ref both come out .jpg and web-sized.
// (jpegs are kept as-is to avoid a lossy re-encode; videos are never touched.)
const JPEG_QUALITY = 0.82, JPEG_MAX_EDGE = 2400;
function commitStaged(w, name, dataUrl, vid, natW, natH) {
  const file = uniqueName(w, name);
  const rec = { file, caption: "", title: "" };
  if (vid) rec.video = true;
  staged[stageKey(w.slug, file)] = dataUrl;
  w.images = w.images || [];
  w.images.push(rec);
  if (!vid) {
    if (natW) { rec.w = natW; rec.h = natH; }
    else {
      const im = new Image();
      im.onload = () => { if (im.naturalWidth) { rec.w = im.naturalWidth; rec.h = im.naturalHeight; touched(); if (curSlug === w.slug) renderMain(); } };
      im.src = dataUrl;
    }
  }
  touched(); renderSide();
  if (curSlug === w.slug) renderMain();
}
function addDropped(w, f) {
  const isVid = VIDEO_RE.test(f.name) || /^video\//.test(f.type);
  const isJpeg = /^image\/jpe?g$/.test(f.type) || /\.jpe?g$/i.test(f.name);
  const reader = new FileReader();
  reader.onload = () => {
    const raw = reader.result;
    if (isVid || isJpeg) { commitStaged(w, f.name, raw, isVid); return; }
    // png / webp / other → flatten onto white + re-encode as jpeg
    const img = new Image();
    img.onload = () => {
      let cw = img.naturalWidth, ch = img.naturalHeight;
      const edge = Math.max(cw, ch);
      if (edge > JPEG_MAX_EDGE) { const s = JPEG_MAX_EDGE / edge; cw = Math.round(cw * s); ch = Math.round(ch * s); }
      let jpeg = raw;
      try {
        const cv = document.createElement("canvas");
        cv.width = cw; cv.height = ch;
        const cx = cv.getContext("2d");
        cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, cw, ch);
        cx.drawImage(img, 0, 0, cw, ch);
        jpeg = cv.toDataURL("image/jpeg", JPEG_QUALITY);
      } catch (_) {}
      const name = f.name.replace(/\.[^.]+$/, "") + ".jpg";
      commitStaged(w, name, jpeg, false, cw, ch);
    };
    img.onerror = () => commitStaged(w, f.name, raw, false);
    img.src = raw;
  };
  reader.readAsDataURL(f);
}
function downloadStaged(w, i) {
  const im = w.images[i]; if (!im) return;
  const url = staged[stageKey(w.slug, im.file)]; if (!url) return;
  const a = document.createElement("a");
  a.href = url; a.download = im.file;
  document.body.appendChild(a); a.click(); a.remove();
}
// the whole work panel is a drop target too (wired once; reads the current work)
(function setupPanelDrop() {
  const m = document.getElementById("main");
  if (!m) return;
  ["dragenter", "dragover"].forEach(ev => m.addEventListener(ev, e => {
    if (!curSlug || !(e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files"))) return;
    e.preventDefault(); m.classList.add("drag");
  }));
  m.addEventListener("dragleave", e => { if (e.target === m) m.classList.remove("drag"); });
  m.addEventListener("drop", e => {
    if (!curSlug) return;
    e.preventDefault(); m.classList.remove("drag");
    const w = findWork(curSlug); if (w) handleDroppedFiles(w, e.dataTransfer.files);
  });
})();

/* ---------- export ---------- */
function buildJSON() {
  const out = clone(data);
  const today = new Date().toISOString().slice(0, 10);
  out.updated = today;
  return JSON.stringify(out, null, 2) + "\n";
}
function download(text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "studio.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
/* ---------- preview: how the work would lay out on its piece page ---------- */
function pvWide(im) { return im.wide === true || isVideo(im) || (im.w && im.h ? (im.w / im.h) >= 2.1 : false); }
function pvFig(w, im, isHeader) {
  const tf = thumbFile(w);
  const tags = [];
  if (isHeader) tags.push('<span class="pv-tag">header</span>');
  if (im.file === tf) tags.push('<span class="pv-tag thumb">thumbnail</span>');
  if (im.trip) tags.push(`<span class="pv-tag trip">trip ${im.trip}</span>`);
  const media = isVideo(im)
    ? `<div class="pv-vid">▶ video · ${esc(im.file)}</div>`
    : `<img src="${esc(srcFor(w.slug, im.file))}" loading="lazy" alt="">`;
  const cap = esc(im.caption || im.file) + (im.title ? ` <span class="seed">· ${esc(im.title)}</span>` : "");
  return `<figure class="pv-fig">${tags.length ? `<div class="pv-tags">${tags.join("")}</div>` : ""}${media}<figcaption class="pv-cap">${cap}</figcaption></figure>`;
}
function buildPreview(w) {
  const imgs = (w.images || []).slice();
  if (!imgs.length) return '<div class="pv-note">this work has no images yet — add some on the left.</div>';
  const hf = headerFile(w);
  const hero = imgs.find(im => im.file === hf) || imgs[0];
  const rest = imgs.filter(im => im !== hero);
  // order the rest in sequence, but pull each triptych group into a single row
  const seenTrip = new Set(); const ordered = [];
  rest.forEach(im => {
    if (im.trip) { if (!seenTrip.has(im.trip)) { seenTrip.add(im.trip); ordered.push({ group: rest.filter(x => x.trip === im.trip) }); } }
    else ordered.push({ one: im });
  });
  const narrow = rest.filter(im => !im.trip && !pvWide(im)).length;
  const twoCap = narrow >= 6 ? 3 : 2;   // busy pages sit 3-up, like piece.html
  const rows = []; let buf = [];
  const flush = () => { if (buf.length) { rows.push(buf); buf = []; } };
  ordered.forEach(o => {
    if (o.group) { flush(); rows.push(o.group); }
    else if (pvWide(o.one)) { flush(); rows.push([o.one]); }
    else { buf.push(o.one); if (buf.length === twoCap) flush(); }
  });
  flush();
  let html = `<div class="pv-note">how “${esc(w.name)}” would lay out on its piece page with your current edits — header first, triptychs grouped, thumbnail marked. a mock of the layout, not the live page.</div>`;
  html += `<h1 class="pv-h1">${esc(w.name)}</h1>`;
  html += `<div class="pv-hero">${pvFig(w, hero, true)}</div>`;
  rows.forEach(r => {
    html += `<div class="pv-row" style="grid-template-columns:repeat(${r.length},1fr)">${r.map(im => pvFig(w, im, false)).join("")}</div>`;
  });
  return html;
}
function openPreview() {
  if (!curSlug) return;
  const w = findWork(curSlug); if (!w) return;
  $("#pv-title").textContent = "preview · " + (w.name || w.slug);
  $("#pv-doc").innerHTML = buildPreview(w);
  $("#pv-doc").scrollTop = 0;
  $("#pv-modal").hidden = false;
}
function closePreview() { $("#pv-modal").hidden = true; }
$("#preview").addEventListener("click", openPreview);
$("#pv-close").addEventListener("click", closePreview);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#pv-modal").hidden) closePreview(); });

$("#export").addEventListener("click", async () => {
  const text = buildJSON();
  download(text);
  // optional convenience POST — never block on it
  try {
    await fetch(SAVE_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ project: "studio", variation: "data", filename: "studio.json", format: "json", content: text }),
    });
  } catch (_) {}
  $("#state").textContent = "exported studio.json — replace data/studio.json";
});
$("#copy").addEventListener("click", async () => {
  const text = buildJSON();
  try {
    await navigator.clipboard.writeText(text);
    $("#copy").textContent = "copied ✓";
  } catch (_) {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); $("#copy").textContent = "copied ✓"; } catch (e) { $("#copy").textContent = "copy failed"; }
    ta.remove();
  }
  setTimeout(() => $("#copy").textContent = "copy json", 1800);
});

$("#restore-discard").addEventListener("click", () => {
  if (!confirm("Discard local unsaved edits and reload from data/studio.json?")) return;
  try { localStorage.removeItem(LS_KEY); } catch (_) {}
  location.reload();
});

// warn on leaving with unsaved changes
addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
