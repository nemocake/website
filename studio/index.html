<!-- two grounds only: white or dark. Same "studio.theme" key as the rest of the site; a saved "cream" reads as white. -->
<script>try{var t=localStorage.getItem("studio.theme");if(!t&&matchMedia("(prefers-color-scheme: dark)").matches)t="dark";document.documentElement.dataset.theme=t==="dark"?"dark":"white";}catch(e){}</script>
<style>
  @font-face { font-family: "Areal"; src: url("../assets/catalogue/fonts/ABCAreal-Regular.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: "Areal"; src: url("../assets/catalogue/fonts/ABCAreal-RegularItalic.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Areal"; src: url("../assets/catalogue/fonts/ABCAreal-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: swap; }

  :root, :root[data-theme="white"] { --bg:#ffffff; --ink:#111111; --ink-rgb:17,17,17; --soft:#3a3a3a; --mute:#8c8c8c; }
  :root[data-theme="dark"] { --bg:#0e0e0e; --ink:#ededed; --ink-rgb:237,237,237; --soft:#bdbdbd; --mute:#7a7a7a; }
  :root { --dur:.6s; --ease:cubic-bezier(.65,0,.35,1); }

  * { box-sizing:border-box; margin:0; padding:0; border-radius:0 !important; }
  html, body { height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
               font:400 12px/1.45 "Areal", sans-serif; letter-spacing:.005em; transition:background .25s, color .25s; }
  img, video { display:block; }
  button { all:unset; cursor:pointer; }
  a { color:inherit; text-decoration:none; }

  /* ---------- top bar: site nav, index, ground ---------- */
  #top { position:fixed; z-index:60; left:28px; right:28px; top:22px; display:flex; gap:22px; align-items:center; }
  #top .home { font-weight:500; letter-spacing:-.02em; font-size:13px; }
  #top nav { display:flex; gap:18px; color:var(--mute); }
  #top nav a:hover, #top nav a.cur { color:var(--ink); }
  #top .right { margin-left:auto; display:flex; gap:22px; color:var(--mute); }
  #top .right button:hover, #top .right button.cur { color:var(--ink); }
  #theme { display:flex; gap:10px; }
  /* grid-zoom slider: only while the index is open */
  /* grid-density mark: a small, morphing echo of the header's 2×2 logo — only while the index is open */
  #ix-zoom-wrap { display:none; align-items:center; }
  body.idx #ix-zoom-wrap { display:flex; }
  #ix-mark { display:block; cursor:ew-resize; touch-action:none; color:var(--mute); transition:color .2s; }
  #ix-zoom-wrap:hover #ix-mark { color:var(--ink); }
  @media (max-width:720px) { #ix-zoom-wrap { display:none !important; } }

  /* ---------- the frame: sized in JS to the picture's proportions; label + plates ride along ---------- */
  #frame { position:fixed; transition:left var(--dur) var(--ease), top var(--dur) var(--ease),
                                      width var(--dur) var(--ease), height var(--dur) var(--ease); }
  body.instant #frame, body.instant .layer { transition:none !important; }
  /* two stacked layers crossfade; cover = the old picture is re-cropped by the moving window instead of jumping in scale */
  .layer { position:absolute; inset:0; opacity:0; cursor:e-resize; }
  .layer.front { opacity:1; }
  .layer > img, .layer > video { width:100%; height:100%; object-fit:cover; }
  .lab, .col { position:absolute; }

  /* ---------- type ---------- */
  .name { font:500 34px/1 "Areal", sans-serif; letter-spacing:-.035em; }
  .note { font:400 14px/1.5 "Areal", sans-serif; letter-spacing:-.005em; }
  .note.clamp { display:-webkit-box; -webkit-line-clamp:6; -webkit-box-orient:vertical; overflow:hidden; }
  .more { color:var(--mute); margin-top:6px; display:inline-block; }
  .more:hover { color:var(--ink); }
  .meta { color:var(--mute); line-height:1.75; }
  .meta b { font-weight:400; color:var(--ink); font-size:13px; }
  .links { display:flex; flex-wrap:wrap; gap:6px 16px; color:var(--mute); justify-content:flex-end; }
  .links a:hover { color:var(--ink); }
  .stack { display:flex; flex-direction:column; gap:14px; }

  /* the label hangs off the picture's bottom-LEFT edge, set right-aligned toward the picture */
  .lab { right:calc(100% + 40px); bottom:0; width:280px; text-align:right; }
  .mplates { display:none; }

  /* the work's plates, stacked on the picture's right edge; scrolls on its own */
  .col { left:calc(100% + 22px); top:0; bottom:0; width:74px; overflow-y:auto; scrollbar-width:none; }
  .col::-webkit-scrollbar { display:none; }
  .col .list { display:flex; flex-direction:column; gap:8px; }
  .col img, .col video, .mplates img, .mplates video { width:100%; cursor:pointer; opacity:.38; transition:opacity .2s; }
  .col img:hover, .col video:hover { opacity:.8; }
  .col .on, .mplates .on { opacity:1; }

  /* ---------- footer film: every work, grouped by series ---------- */
  #strip { position:fixed; z-index:40; left:0; right:0; bottom:0; height:122px; background:var(--bg);
           display:flex; align-items:flex-end; gap:36px; padding:0 28px 36px; overflow-x:auto; scrollbar-width:none; transition:background .25s; }
  #strip::-webkit-scrollbar { display:none; }
  #strip .grp { flex:none; display:flex; flex-direction:column; gap:8px; }
  #strip .sname { color:var(--mute); cursor:pointer; white-space:nowrap; }
  #strip .sname:hover, #strip .grp.cur .sname { color:var(--ink); }
  #strip .row { display:flex; gap:4px; align-items:flex-end; height:58px; }
  #strip .t { flex:none; cursor:pointer; }
  #strip .t img { height:48px; opacity:.35; transition:opacity .2s, height .2s; }
  #strip .grp.cur .t img { opacity:.7; }
  #strip .t:hover img { opacity:1; }
  #strip .t.on img { opacity:1; height:58px; }
  #strip .t.child img { height:36px; }
  #strip .t.child.on img { height:46px; }
  /* hover name lives in a reserved row UNDER the thumbnails — it never covers anything */
  #tip { position:fixed; z-index:41; pointer-events:none; display:none; white-space:nowrap; color:var(--ink); }

  /* ---------- visual index: every plate in one grid, the series names framing it ----------
     point at a name → its plates stay lit; point at a plate → it swells and its name lights */
  #index { position:fixed; inset:0; z-index:55; background:var(--bg);
           opacity:0; pointer-events:none; transition:opacity .3s; }
  body.idx #index { opacity:1; pointer-events:auto; }
  body.idx { overflow:hidden; }
  #ix-field { position:absolute; inset:112px 64px 64px; overflow-y:auto; scrollbar-width:none;
              overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
  #ix-field::-webkit-scrollbar { display:none; }
  #ix-grid { position:relative; }
  .ix-t { position:absolute; display:block; cursor:pointer; overflow:hidden; z-index:1;
          background:rgba(var(--ink-rgb), .04); content-visibility:auto;
          transition:transform .45s cubic-bezier(.22,.8,.24,1), opacity .35s ease, filter .35s ease, box-shadow .45s ease; }
  /* promote to its own layer only while it is actually moving (hover-repel / FLIP) — not permanently, which would pin ~170 layers and make scrolling draggy */
  body.ixhover .ix-t, .ix-t.flip { will-change:transform; }
  .ix-t img { width:100%; height:100%; object-fit:cover; }
  .ix-t .m { position:absolute; left:0; right:0; bottom:0; padding:18px 6px 5px;
             background:linear-gradient(0deg, rgba(var(--ink-rgb), .82), rgba(var(--ink-rgb), 0)); opacity:0; transition:opacity .3s ease .04s; pointer-events:none; }
  .ix-t .m b { display:block; font:500 9px/1.2 "Areal"; color:var(--bg); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ix-t.hot { z-index:30; box-shadow:0 16px 40px rgba(var(--ink-rgb), .3); }
  .ix-t.hot .m { opacity:1; }
  #ix-grid.focus .ix-t:not(.in) { opacity:.1; filter:grayscale(1); }
  .ix-cat { position:absolute; z-index:2; font:500 15px/1 "Areal"; letter-spacing:-.02em; color:var(--mute); cursor:pointer; white-space:nowrap;
            transition:color .25s; }
  .ix-cat.lit { color:var(--ink); }
  #index.dimcats .ix-cat:not(.lit):not(.sel) { color:rgba(var(--ink-rgb), .25); }
  .ix-cat.c0 { left:64px; top:80px; }
  .ix-cat.c1 { right:64px; top:80px; }
  .ix-cat.c2 { left:24px; top:50%; transform:translate(-50%, -50%) rotate(-90deg) translateY(50%); }
  .ix-cat.c3 { right:24px; top:50%; transform:translate(50%, -50%) rotate(90deg) translateY(50%); }
  .ix-cat.c4 { left:50%; bottom:28px; transform:translateX(-50%); }
  /* a drilled-into section: its name stays lit + underlined; a hint offers the way back */
  .ix-cat.sel { color:var(--ink); }
  .ix-cat.sel::after { content:""; position:absolute; left:0; right:0; bottom:-5px; height:1px; background:var(--ink); }
  .load-error { position:fixed; left:28px; top:90px; color:var(--mute); }

  @media (max-width:760px) {
    #top { left:16px; right:16px; top:16px; flex-wrap:wrap; gap:6px 14px; }
    #top nav { gap:12px; }
    #top .right { margin-left:0; width:100%; gap:16px; }
    .lab { right:auto; left:var(--labl, 0px); width:var(--labw, 100%); top:calc(100% + 14px); bottom:auto; text-align:left;
           max-height:var(--labmax, 40vh); overflow-y:auto; scrollbar-width:none; overscroll-behavior:contain; }
    .lab::-webkit-scrollbar { display:none; }
    /* the plates come first on a phone — right under the picture, never pushed off by a long note */
    .lab .mplates { order:-1; margin-bottom:4px; }
    .links { justify-content:flex-start; }
    .col { display:none; }
    .mplates { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
    .mplates::-webkit-scrollbar { display:none; }
    .mplates img, .mplates video { width:auto; height:44px; flex:none; }
    .name { font-size:28px; }
    /* phones: the strip sizes to its contents so the series names never clip, and clears the home indicator */
    #strip { height:auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); gap:24px; }
    #strip .row { height:48px; }
    #strip .t img { height:40px; } #strip .t.on img { height:48px; }
    #strip .t.child img { height:30px; } #strip .t.child.on img { height:38px; }
    #index { overflow-y:auto; }
    #ix-cats { position:relative; display:flex; flex-wrap:wrap; gap:8px 16px; padding:92px 16px 18px; }
    .ix-cat { position:static; transform:none !important; font-size:13px; }
    #ix-field { position:static; inset:auto; overflow:visible; padding:0 16px 40px; }
  }
</style>

<div id="top">
  <div data-gridnav data-cur="studio"></div>
  <div class="right">
    <span id="ix-zoom-wrap"><canvas id="ix-mark" title="grid density" aria-label="grid density"></canvas></span>
    <button id="idx-btn" type="button">index</button>
    <span id="theme" role="group" aria-label="page ground"><button type="button" data-theme="white">light</button><button type="button" data-theme="dark">dark</button></span>
  </div>
</div>

<div id="frame"><div class="layer front" id="pa"></div><div class="layer" id="pb"></div><div class="lab"></div><div class="col"></div></div>
<div id="strip"></div>
<div id="tip"></div>
<div id="index" aria-label="visual index"><div id="ix-cats"></div><div id="ix-field"><div id="ix-grid"></div></div></div>

<script>
const IMG_V = "?v=1784771550";
const $ = (s, r = document) => r.querySelector(s);
// a full http(s) URL (e.g. a video hosted on R2/CDN) is used as-is; a bare name resolves to the work's local asset folder
const src = (slug, file) => /^https?:\/\//.test(file) ? file : `assets/img/${slug}/${file}${IMG_V}`;
const thumb = slug => `assets/img/${slug}/thumb.jpg${IMG_V}`;
const isVid = im => im.video === true || /\.(mp4|webm|mov)$/i.test(im.file);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const low = s => esc(String(s ?? "").toLowerCase());

let W, GROUPS, SERIES, ARTICLES, wi = 0, k = 0;

/* ---------- ground: white or dark; only written when the visitor picks one ---------- */
function markTheme() {
  const t = document.documentElement.dataset.theme;
  document.querySelectorAll("#theme button").forEach(b => b.classList.toggle("cur", b.dataset.theme === t));
}
markTheme();

/* ---------- data ---------- */
(async function boot() {
  let d;
  try {
    const r = await fetch("data/studio.json", { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch (e) {
    document.body.insertAdjacentHTML("beforeend", `<div class="load-error">could not load data/studio.json — ${esc(e.message)}</div>`);
    return;
  }
  // articles map to works by their own "work" field
  ARTICLES = new Set();
  try {
    const al = await fetch("data/articles.json", { cache: "no-store" }).then(r => r.json());
    const full = await Promise.all((al.articles || []).map(a => fetch(`data/articles/${a.slug}.json`, { cache: "no-store" }).then(r => r.json()).catch(() => null)));
    full.forEach(a => { if (a && a.work) ARTICLES.add(a.work); });
  } catch (_) { /* no article links then */ }

  SERIES = Object.fromEntries((d.series || []).map(s => [s.id, s]));
  const ed = (x, y) => (x.edition ?? 999) - (y.edition ?? 999);
  const works = (d.works || []).filter(w => w.images && w.images.length);
  const top = works.filter(w => !w.parent), kids = slug => works.filter(w => w.parent === slug).sort(ed);
  const withKids = ws => ws.sort(ed).flatMap(w => [w, ...kids(w.slug)]);
  GROUPS = [...(d.series || []).map(s => ({ id: s.id, name: s.name.toLowerCase(), works: withKids(top.filter(w => w.series === s.id && w.kind !== "exploration")) })),
            { id: "explorations", name: "explorations", works: withKids(top.filter(w => w.kind === "exploration")) }].filter(g => g.works.length);
  W = GROUPS.flatMap(g => g.works);

  // deep link: ?w=<slug>&p=<plate>; old slugs and old #/s/<series>/<slug> links still land
  const SLUG_ALIAS = { paint: "room-with-cube", "paintsystem2-room": "broken-rooms", "paintsystem2-die": "horizons",
    "paintsystem2-chamber": "chamber", "paintsystem2-interior": "interior", "jester-poster": "idea-403",
    "idea-044-grid": "idea-044", "idea-107-grid": "idea-107", sleeve: "visual-scores" };
  const q = new URLSearchParams(location.search);
  let slug = q.get("w");
  if (!slug) { const m = location.hash.match(/^#\/s\/[^/]+\/([^/?#]+)/); if (m) slug = decodeURIComponent(m[1]); }
  if (!slug) { const m = location.hash.match(/^#s-(.+)$/); const g = m && GROUPS.find(g => g.id === m[1]); if (g) slug = g.works[0].slug; }
  slug = SLUG_ALIAS[slug] || slug;
  if (slug) { const n = W.findIndex(w => w.slug === slug); if (n >= 0) { wi = n; k = Math.min(Math.max(0, +q.get("p") || 0), W[n].images.length - 1); } }

  buildStrip();
  render(true);
})();

/* ---------- fragments ---------- */
const groupOf = w => GROUPS.find(g => g.works.includes(w));
const seriesOf = w => SERIES[w.series ?? W.find(x => x.slug === w.parent)?.series];
const noteH = w => !w.note ? "" :
  `<div><p class="note ${w.note.length > 320 ? "clamp" : ""}">${esc(w.note)}</p>${w.note.length > 320 ? `<button class="more" type="button">more</button>` : ""}</div>`;
// the after/from meta line is turned off in the piece view (not worth showing); the data stays in studio.json
const metaH = w => "";
const linksH = w => {
  const l = [];
  if (w.live) l.push(/^https?:/.test(w.live) ? `<a href="${esc(w.live)}" target="_blank" rel="noopener">${esc(w.live.replace(/^https?:\/\//, "").replace(/\/$/, ""))} ↗</a>` : `<a href="${esc(w.live)}">open it live ↗</a>`);
  if (w.essay) l.push(`<a href="${esc(w.essay.url)}">essay ↗</a>`);
  if (ARTICLES.has(w.slug)) l.push(`<a href="piece.html?w=${encodeURIComponent(w.slug)}">studio notes ↗</a>`);
  if (w.embeds && w.embeds.length) l.push(`<a href="${esc(w.embeds[0].url)}" target="_blank" rel="noopener">heard ↗</a>`);
  return l.length ? `<div class="links">${l.join("")}</div>` : "";
};
const plateThumb = (w, im, j) => isVid(im)
  ? `<video src="${src(w.slug, im.file)}" data-k="${j}" class="${j === k ? "on" : ""}" muted playsinline preload="metadata"></video>`
  : `<img src="${src(w.slug, im.file)}" data-k="${j}" class="${j === k ? "on" : ""}" loading="lazy" alt="">`;
const platesList = w => w.images.length < 2 ? "" : `<div class="list">${w.images.map((im, j) => plateThumb(w, im, j)).join("")}</div>`;
const labH = w => `<div class="stack"><div class="name">${low(w.name)}</div>${noteH(w)}${metaH(w)}${linksH(w)}${
  w.images.length > 1 ? `<div class="mplates">${w.images.map((im, j) => plateThumb(w, im, j)).join("")}</div>` : ""}</div>`;

/* ---------- layout: picture fits what's left; label + picture + column centre as one group ---------- */
function frameBox() {
  const w = W[wi], im = w.images[k], ar = (im.w && im.h) ? im.w / im.h : 1.3;
  const mobile = innerWidth < 760, rl = mobile ? 0 : 320, rr = mobile ? 0 : 96;
  const top = mobile ? 96 : 64, bottom = mobile ? $("#strip").offsetHeight + 12 : 142, side = mobile ? 16 : 28;
  const availW = innerWidth - side * 2 - rl - rr;
  const availH = innerHeight - top - bottom - (mobile ? 250 : 0);
  let fw = availW, fh = fw / ar;
  if (fh > availH) { fh = availH; fw = fh * ar; }
  return { left: (innerWidth - (fw + rl + rr)) / 2 + rl, top: top + (mobile ? 0 : (availH - fh) / 2), width: fw, height: fh };
}
function placeFrame() {
  const b = frameBox(), f = $("#frame");
  Object.assign(f.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px", height: b.height + "px" });
  // phones: the label scrolls in whatever room is left between the picture and the strip
  if (innerWidth < 760) {
    f.style.setProperty("--labmax", Math.max(120, innerHeight - (b.top + b.height + 14) - $("#strip").offsetHeight - 10) + "px");
    f.style.setProperty("--labl", (16 - b.left) + "px");          // full screen width, whatever the picture's shape
    f.style.setProperty("--labw", (innerWidth - 32) + "px");
  }
}
function instant(fn) { document.body.classList.add("instant"); fn(); $("#frame").offsetWidth; requestAnimationFrame(() => document.body.classList.remove("instant")); }
addEventListener("resize", () => W && instant(placeFrame));

const wait = ms => new Promise(r => setTimeout(r, ms));
// resolves with a ready-to-insert element (the same one that loaded, so nothing fetches twice)
function load(w, im) {
  const url = src(w.slug, im.file);
  if (isVid(im)) return new Promise(r => {
    const v = document.createElement("video");
    Object.assign(v, { muted: true, loop: true, autoplay: true, playsInline: true, preload: "auto" });
    let done = false; const fin = () => { if (done) return; done = true;
      if (!(im.w && im.h) && v.videoWidth) { im.w = v.videoWidth; im.h = v.videoHeight; }
      r(v); };
    v.addEventListener("loadeddata", fin); v.addEventListener("error", fin); setTimeout(fin, 3000);
    v.src = url;
  });
  return new Promise(r => { const i = new Image(); i.alt = "";
    i.onload = i.onerror = () => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()).then(() => r(i)); i.src = url; });
}
function setLayer(layer, el) {
  layer.querySelectorAll("video").forEach(v => v.pause());
  layer.replaceChildren(el);
  if (el.tagName === "VIDEO") el.play().catch(() => {});
}

/* ---------- text: rolls up block by block, then unrolls with the new words ---------- */
const EASE = "cubic-bezier(.65,0,.35,1)";
const blocks = () => [...document.querySelectorAll("#frame .lab .stack > *, #frame .col .list > *")];
const stagger = i => Math.min(i, 6) * 40;            // long plate lists don't drag the timing out
const shown  = { opacity: 1, clipPath: "inset(0 0 0% 0)",   transform: "translateY(0)" };
const hidden = { opacity: 0, clipPath: "inset(0 0 100% 0)", transform: "translateY(-6px)" };
function rollUp() {
  return Promise.all(blocks().map((b, i) =>
    b.animate([shown, hidden], { duration: 240, delay: stagger(i), easing: EASE, fill: "forwards" }).finished.catch(() => {})));
}
function unroll() {
  return Promise.all(blocks().map((b, i) =>
    b.animate([hidden, shown], { duration: 380, delay: stagger(i), easing: EASE, fill: "backwards" }).finished.catch(() => {})));
}

let token = 0, first = true, lastLab = "", lastCol = "", rolledUp = false;

async function render(workChanged) {
  const my = ++token, w = W[wi], f = $("#frame"), lab = $(".lab", f), col = $(".col", f);
  const im = w.images[k];
  const DUR = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dur")) * 1000;
  history.replaceState(null, "", `?w=${encodeURIComponent(w.slug)}${k ? `&p=${k}` : ""}`);
  document.title = `${w.name.toLowerCase()} · studio · con.rad`;
  syncStrip(); $("#tip").style.display = "none";
  f.querySelectorAll("[data-k]").forEach(t => t.classList.toggle("on", +t.dataset.k === k));

  // only animate words that actually change (stepping plates within a work leaves them alone)
  const newLab = labH(w), newCol = platesList(w);
  const textChanges = workChanged && (newLab !== lastLab || newCol !== lastCol);
  const setText = () => { lab.innerHTML = lastLab = newLab; col.innerHTML = lastCol = newCol; col.scrollTop = 0; rolledUp = false; };
  // an interrupted click can leave the old words rolled up; if they're staying, bring them back
  if (!textChanges && rolledUp) { rolledUp = false; unroll(); }
  if (textChanges && !first) rolledUp = true;

  const out = (textChanges && !first) ? rollUp() : Promise.resolve();   // starts on click, while the picture loads

function step(d) { const n = W[wi].images.length; if (n < 2) return; k = (k + d + n) % n; render(false); }

  else if (plate !== k) { k = plate; render(false); }

/* ---------- footer film ---------- */
function buildStrip() {

    <div class="grp" data-g="${g.id}">
      <div class="sname" data-jump="${g.works[0].slug}">${esc(g.name)}</div>
      <div class="row">${g.works.map(w => `<div class="t ${w.parent ? "child" : ""}" data-w="${w.slug}"><img src="${thumb(w.slug)}" loading="lazy" alt="${esc(w.name)}"></div>`).join("")}</div>

}
function syncStrip() {

  document.querySelectorAll("#strip .t").forEach(t => t.classList.toggle("on", t.dataset.w === w.slug));
  document.querySelectorAll("#strip .grp").forEach(el => el.classList.toggle("cur", el.dataset.g === g.id));
  const t = $(`#strip .t[data-w="${w.slug}"]`), strip = $("#strip");
  strip.scrollTo({ left: t.offsetLeft - strip.clientWidth / 2 + t.offsetWidth / 2, behavior: first ? "auto" : "smooth" });
}

/* ---------- visual index: every plate in one grid, the series framing it ---------- */
const IX_GAP = 8, IX_BASE = 96;                                   // IX_BASE = target tile width at zoom 1
let ixState = [], ixBuilt = false, ixRadius = 200, ixSel = null, ixCols = 0, ixColW = 100;   // ixSel = the drilled-into series, null = all
// grid density locks to whole grids (2×2 .. 5×5); each maps to a target tile zoom for the masonry
const IX_DMIN = 2, IX_DMAX = 5, IX_DENS_ZOOM = { 2: 4.5, 3: 2.2, 4: 1.25, 5: 0.72 };
let ixDens = 5;                                                   // densest by default
try { const d = parseInt(localStorage.getItem("studio.ixdens"), 10); if (d >= IX_DMIN && d <= IX_DMAX) ixDens = d; } catch (_) {}
let ixZoom = IX_DENS_ZOOM[ixDens];                                // >1 = bigger tiles / fewer columns, <1 = denser
const ixVisible = () => ixSel ? ixState.filter(s => s.x.g === ixSel) : ixState;
const FLIP_EASE = "cubic-bezier(.65,0,.35,1)";
function buildIndex() {

  for (let a = plates.length - 1; a > 0; a--) { const b = Math.floor(rnd() * (a + 1)); [plates[a], plates[b]] = [plates[b], plates[a]]; }
  $("#ix-cats").innerHTML = GROUPS.map((g, n) => `<span class="ix-cat c${n}" data-g="${g.id}">${esc(g.name)}</span>`).join("");
  $("#ix-grid").innerHTML = plates.map(x => `<a class="ix-t" data-open="${x.w.slug}" data-p="${x.p}" data-g="${x.g}"><img src="${src(x.w.slug, x.im.file)}" loading="lazy" decoding="async" alt="${esc(x.w.name)}"><span class="m"><b>${low(x.w.name)}</b></span></a>`).join("");
  ixState = [...$("#ix-grid").children].map((el, n) => ({ el, x: plates[n], ar: plates[n].im.w && plates[n].im.h ? plates[n].im.w / plates[n].im.h : 1, shown: true }));
  ixState.forEach(s => { s.el.addEventListener("mouseenter", () => ixHot(s)); s.el.addEventListener("mouseleave", ixCool); });
  document.querySelectorAll(".ix-cat").forEach(c => {
    c.addEventListener("mouseenter", () => { if (!ixSel) ixLight(c.dataset.g, true); });   // hover = preview; click = drill in (handled globally)
    c.addEventListener("mouseleave", () => { if (!ixSel) ixLight(null, true); });

}
function ixLayout() {
  const Wd = $("#ix-grid").clientWidth; if (!Wd) return;
  const cols = Math.max(2, Math.min(14, Math.round((Wd + IX_GAP) / (IX_BASE * ixZoom + IX_GAP)))), colW = (Wd - (cols - 1) * IX_GAP) / cols;
  ixCols = cols; ixColW = colW; ixRadius = 2.5 * colW;
  const colH = new Array(cols).fill(0);
  ixVisible().forEach(s => {
    let c = 0; for (let n = 1; n < cols; n++) if (colH[n] < colH[c]) c = n;
    const h = colW / s.ar, x = c * (colW + IX_GAP), y = colH[c];
    Object.assign(s, { cx: x + colW / 2, cy: y + h / 2 });
    Object.assign(s.el.style, { left: x + "px", top: y + "px", width: colW + "px", height: h + "px" });
    colH[c] += h + IX_GAP;

}
// bring every tile's inline style into agreement with s.shown, cancelling any in-flight animation (whose fill would otherwise stick)
function ixPrime() {
  ixState.forEach(s => {
    s.el.getAnimations().forEach(a => a.cancel());
    s.el.style.transform = ""; s.el.style.pointerEvents = s.shown ? "" : "none";
    s.el.style.display = s.shown ? "" : "none"; s.el.style.opacity = "";

}
// drill into a section (or back to all) — FLIP: measure, re-pack the visible set, animate the difference on the compositor
function ixSelect(id) {

  ixCool();

  const first = new Map();
  ixState.forEach(s => { if (s.shown) first.set(s, s.el.getBoundingClientRect()); });
  ixSel = id;
  document.body.classList.toggle("ixsel", !!id);
  $("#index").classList.toggle("dimcats", !!id);
  document.querySelectorAll(".ix-cat").forEach(c => c.classList.toggle("sel", !!id && c.dataset.g === id));
  const willShow = new Set(ixVisible());
  ixState.forEach(s => { if (willShow.has(s) && !s.shown) { s.el.style.display = ""; s.el.style.opacity = "0"; } });  // reveal returners (hidden) so they get laid out
  ixLayout();                                                      // LAST positions for the visible set
  ixState.forEach(s => {
    const member = willShow.has(s), wasShown = s.shown;

      s.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, easing: FLIP_EASE });
    } else if (member) {                                           // staying → FLIP from old rect to new
      const f = first.get(s), l = s.el.getBoundingClientRect();
      const dx = f.left - l.left, dy = f.top - l.top, sx = (f.width / l.width) || 1, sy = (f.height / l.height) || 1;
      if (dx || dy || sx !== 1 || sy !== 1)
        s.el.animate([{ transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, transformOrigin: "0 0" }, { transform: "none", transformOrigin: "0 0" }], { duration: 560, easing: FLIP_EASE });
    } else if (wasShown) {                                         // leaving → fade out, then drop from the flow
      s.el.style.pointerEvents = "none"; s.el.style.opacity = "0";
      s.el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, easing: FLIP_EASE }).onfinish = () => { if (!s.shown) s.el.style.display = "none"; };

}
// instant reset (used when the index closes) so it reopens showing everything
function ixClearSel() {
  if (!ixSel) return; ixSel = null; document.body.classList.remove("ixsel");
  document.querySelectorAll(".ix-cat").forEach(c => c.classList.remove("sel"));
  $("#index").classList.remove("dimcats");
  ixState.forEach(s => { s.shown = true; });
  ixPrime(); ixLayout();
}
// grid zoom: a bigger target width means fewer, larger columns. Only re-packs (and FLIP-glides) when the column count actually crosses a step, so dragging the slider stays cheap.
const IX_ZMIN = 0.55, IX_ZMAX = 4.5;                               // the density stops live within these zoom bounds
function ixSetZoom(z, animate) {
  z = Math.max(IX_ZMIN, Math.min(IX_ZMAX, z));
  const live = document.body.classList.contains("idx");
  const Wd = $("#ix-grid").clientWidth || 1;
  const newCols = Math.max(2, Math.min(14, Math.round((Wd + IX_GAP) / (IX_BASE * z + IX_GAP))));
  // same column count -> identical layout, so just remember the value (no per-tick restyle while dragging within a step)
  if (newCols === ixCols) { ixZoom = z; return; }

  ixVisible().forEach(s => first.set(s, s.el.getBoundingClientRect()));

    const f = first.get(s); if (!f) return;
    const l = s.el.getBoundingClientRect();
    const dx = f.left - l.left, dy = f.top - l.top, sx = (f.width / l.width) || 1, sy = (f.height / l.height) || 1;
    if (dx || dy || sx !== 1 || sy !== 1) {
      s.el.getAnimations().forEach(a => a.cancel());
      s.el.classList.add("flip");
      s.el.animate([{ transform: `translate(${dx}px,${dy}px) scale(${sx},${sy})`, transformOrigin: "0 0" }, { transform: "none", transformOrigin: "0 0" }],
        { duration: 400, easing: FLIP_EASE }).onfinish = () => s.el.classList.remove("flip");
    }
  });
}
/* ---- grid-density mark: the quantized zoom control; echoes the header's 2×2 logo and pops on each change ---- */
const ixMark = $("#ix-mark"), ixMctx = ixMark.getContext("2d");
const IXM_SZ = 34, IXM_DPR = Math.min(2, window.devicePixelRatio || 1);
ixMark.width = IXM_SZ * IXM_DPR; ixMark.height = IXM_SZ * IXM_DPR;
ixMark.style.width = ixMark.style.height = IXM_SZ + "px"; ixMctx.scale(IXM_DPR, IXM_DPR);
let ixMScale = 1, ixMVel = 0, ixMAlpha = 1, ixMRAF = 0;
function ixMarkDraw() {
  ixMctx.clearRect(0, 0, IXM_SZ, IXM_SZ);
  ixMctx.lineCap = "butt"; ixMctx.lineJoin = "miter";
  ixMctx.strokeStyle = getComputedStyle(ixMark).color || "#000";
  ixMctx.save();
  ixMctx.translate(IXM_SZ / 2, IXM_SZ / 2); ixMctx.scale(ixMScale, ixMScale); ixMctx.translate(-IXM_SZ / 2, -IXM_SZ / 2);
  const n = ixDens, M = 1, span = IXM_SZ - M * 2, gap = Math.min(5, span / n * 0.22), cell = (span - (n - 1) * gap) / n;
  ixMctx.globalAlpha = ixMAlpha; ixMctx.lineWidth = 1;

    ixMctx.strokeRect(Math.round(x) + 0.5, Math.round(y) + 0.5, Math.round(cell) - 1, Math.round(cell) - 1);
  }

}
function ixMarkAnim() {                                            // springy settle, like the header's travelling square
  ixMVel += (1 - ixMScale) * 0.22; ixMVel *= 0.68; ixMScale += ixMVel;
  if (ixMAlpha < 1) ixMAlpha = Math.min(1, ixMAlpha + 0.09);
  ixMarkDraw();
  if (Math.abs(1 - ixMScale) < 0.001 && Math.abs(ixMVel) < 0.001 && ixMAlpha >= 1) { ixMScale = 1; ixMVel = 0; ixMRAF = 0; return; }
  ixMRAF = requestAnimationFrame(ixMarkAnim);
}
function ixSetDens(n) {
  n = Math.max(IX_DMIN, Math.min(IX_DMAX, Math.round(n)));
  if (n === ixDens) return;
  ixDens = n;
  try { localStorage.setItem("studio.ixdens", n); } catch (_) {}
  ixMScale = 0.84; ixMVel = 0; ixMAlpha = 0.5;                     // pop the new whole grid in
  if (!ixMRAF) ixMRAF = requestAnimationFrame(ixMarkAnim);
  ixSetZoom(IX_DENS_ZOOM[n], true);                               // drive the existing masonry FLIP
}
// inputs: scroll to step, drag to ratchet, click to cycle
ixMark.addEventListener("wheel", e => { e.preventDefault(); ixSetDens(ixDens + (e.deltaY > 0 ? 1 : -1)); }, { passive: false });
let ixMDrag = false, ixMLastX = 0, ixMAcc = 0, ixMMoved = 0;
ixMark.addEventListener("pointerdown", e => { ixMDrag = true; ixMLastX = e.clientX; ixMAcc = 0; ixMMoved = 0; ixMark.setPointerCapture(e.pointerId); });
ixMark.addEventListener("pointermove", e => {
  if (!ixMDrag) return;
  const dx = e.clientX - ixMLastX; ixMAcc += dx; ixMMoved += Math.abs(dx); ixMLastX = e.clientX;
  const STEP = 16; while (ixMAcc >= STEP) { ixSetDens(ixDens + 1); ixMAcc -= STEP; } while (ixMAcc <= -STEP) { ixSetDens(ixDens - 1); ixMAcc += STEP; }
});
ixMark.addEventListener("pointerup", () => { const wasClick = ixMMoved < 4; ixMDrag = false; if (wasClick) ixSetDens(ixDens >= IX_DMAX ? IX_DMIN : ixDens + 1); });
function ixHot(h) {
  document.body.classList.add("ixhover");                          // promote tiles to layers only during the repel
  // hover-zoom scales with how big the tiles already are: a strong lift when dense (small tiles),
  // down to a gentle one at the most zoomed-in density (big tiles) so a hovered piece can't balloon off-screen.
  const grow = 0.1 + 0.6 * Math.max(0, Math.min(1, (380 - ixColW) / 280));   // ~0.7 dense .. ~0.1 zoomed-in
  const repel = 44 * (grow / 0.7);                                 // neighbours step aside in proportion to the lift
  // anchor the growth inward near an edge, so a bordering piece expands into the grid instead of spilling off and getting clipped
  const fr = $("#ix-field").getBoundingClientRect(), tr = h.el.getBoundingClientRect();
  const gW = tr.width * grow, gH = tr.height * grow;               // total growth on each axis
  const sL = tr.left - fr.left, sR = fr.right - tr.right, sT = tr.top - fr.top, sB = fr.bottom - tr.bottom;
  let ox = 0.5, oy = 0.5;
  if (gW > 0) { if (gW / 2 > sL) ox = Math.max(0, sL / gW); else if (gW / 2 > sR) ox = Math.min(1, 1 - sR / gW); }

  h.el.classList.add("hot");
  h.el.style.transformOrigin = (ox * 100).toFixed(1) + "% " + (oy * 100).toFixed(1) + "%";
  h.el.style.transform = `scale(${(1 + grow).toFixed(3)})`;
  ixState.forEach(o => { if (o === h) return; const dx = o.cx - h.cx, dy = o.cy - h.cy, d = Math.hypot(dx, dy) || 1e-4, m = repel * Math.exp(-d / ixRadius);
    o.el.style.transform = `translate(${(dx / d * m).toFixed(1)}px,${(dy / d * m).toFixed(1)}px)`; });
  if (!ixSel) ixLight(h.x.g, false);
}
function ixCool() { document.body.classList.remove("ixhover"); ixState.forEach(o => { o.el.classList.remove("hot"); o.el.style.transform = ""; o.el.style.transformOrigin = ""; }); if (!ixSel) ixLight(null, false); }
function ixLight(id, focusGrid) {
  document.querySelectorAll(".ix-cat").forEach(c => c.classList.toggle("lit", c.dataset.g === id));
  $("#index").classList.toggle("dimcats", !!id);
  $("#ix-grid").classList.toggle("focus", !!(id && focusGrid));
  if (focusGrid) ixState.forEach(s => s.el.classList.toggle("in", s.x.g === id));
}
addEventListener("resize", () => { if (document.body.classList.contains("idx")) { clearTimeout(ixLayout.t); ixLayout.t = setTimeout(ixLayout, 100); } });
function toggleIndex(on) { if (on && !ixBuilt) buildIndex(); if (!on) ixClearSel(); document.body.classList.toggle("idx", on); if (on) { ixMarkDraw(); ixLayout(); requestAnimationFrame(ixLayout); } $("#idx-btn").classList.toggle("cur", on); $("#idx-btn").textContent = on ? "close index" : "index"; }

/* ---------- input ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const th = t.closest("#theme button");
  if (th) { document.documentElement.dataset.theme = th.dataset.theme; try { localStorage.setItem("studio.theme", th.dataset.theme); } catch (_) {} markTheme(); ixMarkDraw(); return; }
  if (t.id === "idx-btn") return toggleIndex(!document.body.classList.contains("idx"));
  const cat = t.closest(".ix-cat"); if (cat) return ixSelect(cat.dataset.g);               // drill into a section
  const cell = t.closest("[data-open]"); if (cell) { e.preventDefault(); ixCool(); toggleIndex(false); return goWork(cell.dataset.open, +(cell.dataset.p || 0)); }
  if (document.body.classList.contains("idx") && ixSel && !t.closest(".ix-t")) return ixSelect(null);   // click empty space → back to all
  const hit = t.closest("#strip [data-w]"); if (hit) return goWork(hit.dataset.w);
  if (t.dataset.jump) return goWork(t.dataset.jump);
  if (t.dataset.k != null) { k = +t.dataset.k; return render(false); }

});
addEventListener("keydown", e => {
  if (e.key === "Escape") { if (document.body.classList.contains("idx") && ixSel) return ixSelect(null); return toggleIndex(false); }
  if (!W || document.body.classList.contains("idx") || e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (e.key === "ArrowDown") { e.preventDefault(); wi = (wi + 1) % W.length; k = 0; render(true); }
  else if (e.key === "ArrowUp") { e.preventDefault(); wi = (wi - 1 + W.length) % W.length; k = 0; render(true); }
});
