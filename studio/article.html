<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>STUDIO · Conrad House</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem("studio.theme")||"cream"}catch(e){}</script>
<link rel="stylesheet" href="assets/catalogue.css" />
<script src="assets/graphite.js" defer></script>
<script src="assets/masthead.js" defer></script>
<script src="assets/lightbox.js" defer></script>
<script src="assets/nav.js" defer></script>
<script src="assets/theme.js" defer></script>
<style>
  /* ---------- article shell ---------- */
  .art-wrap { position: relative; z-index: 2; max-width: 1120px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px) 110px; }

  /* corner halftone ornament */
  .corner-dots {
    position: fixed; width: 90px; height: 90px; pointer-events: none; z-index: 1; opacity: .5;
    background-image: radial-gradient(rgba(28,26,22,.35) 1px, transparent 1.4px);
    background-size: 9px 9px;
    -webkit-mask-image: radial-gradient(circle at var(--cx) var(--cy), #000 0%, transparent 75%);
    mask-image: radial-gradient(circle at var(--cx) var(--cy), #000 0%, transparent 75%);
  }
  .corner-dots.tl { top: 0; left: 0; --cx: 0%; --cy: 0%; }
  .corner-dots.tr { top: 0; right: 0; --cx: 100%; --cy: 0%; }

  .furniture {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 26px 0 10px; border-bottom: 2px solid var(--ink);
    font-family: var(--font-mono); font-size: 10px;
    letter-spacing: .28em; text-transform: lowercase; color: var(--sanguine);
  }
  .furniture a:hover { color: var(--ink); }
  .furniture .right { color: var(--ink-faint); }

  .art-head { padding: 34px 0 8px; }
  .art-head h1 {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(40px, 7vw, 72px); line-height: 1.0; margin-left: -2px;
  }
  .art-head .sub { font-family: var(--font-text); font-style: italic; color: var(--ink-soft); margin-top: 8px; font-size: 16px; }
  .art-head .date { font-family: var(--font-mono); font-size: 10px; letter-spacing: .2em; color: var(--sanguine); float: right; margin-top: 10px; }

  /* ---------- mode toggle ---------- */
  .mode-toggle {
    position: fixed; top: 18px; right: 18px; z-index: 40; display: flex;
    border: 1px solid var(--ink); background: var(--paper);
  }
  .mode-toggle button {
    background: none; border: 0; cursor: pointer; padding: 8px 14px;
    font-family: var(--font-mono); font-size: 9px; letter-spacing: .22em;
    text-transform: lowercase; color: var(--ink-faint);
  }
  .mode-toggle button.on { background: var(--ink); color: var(--paper); }

  /* ---------- body blocks ---------- */
  .art-body { margin-top: 26px; }
  .cols p { font-size: 15.5px; line-height: 1.72; text-align: justify; hyphens: auto; margin-bottom: 1.1em; }
  .cols p a { color: var(--sanguine); border-bottom: 1px solid rgba(156,61,30,.4); }

  .drop::first-letter {
    font-family: var(--font-display); color: var(--sanguine);
    font-size: 340%; float: left; line-height: .74; padding: 7px 10px 0 0;
  }

  .a-subhead {
    font-family: var(--font-display); font-size: clamp(24px, 3.4vw, 34px);
    color: var(--sanguine); text-align: center; line-height: 1.2;
    max-width: 700px; margin: 46px auto 38px;
  }

  .a-quote {
    border-left: 3px solid var(--sanguine); padding-left: 26px;
    margin: 44px auto; max-width: 720px;
  }
  .a-quote p {
    font-family: var(--font-text); font-style: italic; font-weight: 500;
    font-size: 19px; line-height: 1.6; color: var(--ink);
  }
  .a-quote p::before { content: "\201C"; color: var(--sanguine); font-size: 26px; }
  .a-quote footer { font-family: var(--font-mono); font-size: 9px; letter-spacing: .22em; text-transform: lowercase; color: var(--ink-faint); margin-top: 10px; }

  figure.a-img { margin: 42px auto; max-width: 780px; }
  figure.a-img .frame { border: 1px solid var(--rule); background: var(--paper-deep); padding: 8px; }
  figure.a-img img { width: 100%; display: block; }
  .a-cap { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; color: var(--ink-faint); margin-top: 8px; display: flex; justify-content: space-between; gap: 12px; }
  .a-cap .tag { color: var(--sanguine); text-transform: lowercase; letter-spacing: .18em; white-space: nowrap; }

  .a-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin: 42px 0; }
  .a-pair figure { margin: 0; }
  .a-pair .frame { border: 1px solid var(--rule); background: var(--paper-deep); padding: 6px; }
  .a-pair img { width: 100%; display: block; }
  @media (max-width: 700px) { .a-pair { grid-template-columns: 1fr; } }

  .a-code { margin: 42px auto; max-width: 780px; border: 1px solid var(--ink); }
  .a-code .bar {
    display: flex; justify-content: space-between; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--rule); font-family: var(--font-mono);
    font-size: 9px; letter-spacing: .16em; text-transform: lowercase;
  }
  .a-code .bar .t { color: var(--sanguine); }
  .a-code .bar .f { color: var(--ink-faint); }
  .a-code pre {
    margin: 0; padding: 16px 18px; overflow-x: auto; background: var(--paper-deep);
    font-family: var(--font-code); font-size: 12px; line-height: 1.62; color: var(--ink);
  }
  .a-code .cap { padding: 8px 14px; border-top: 1px solid var(--rule); font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint); }

  /* ---------- SPREAD mode ---------- */
  body.spread .cols { column-count: 2; column-gap: 52px; column-rule: 1px solid var(--rule-faint); }
  @media (max-width: 860px) { body.spread .cols { column-count: 1; } }
  body.spread .art-head h1 { font-size: clamp(48px, 8.5vw, 92px); }

  /* ---------- READER mode ---------- */
  body.reader .art-wrap { max-width: 720px; }
  body.reader .cols { column-count: 1; }
  body.reader .cols p { text-align: left; font-size: 16.5px; line-height: 1.85; hyphens: none; }
  body.reader .drop::first-letter { font-size: 100%; float: none; color: inherit; padding: 0; font-family: inherit; }
  body.reader .a-subhead { text-align: left; margin: 40px 0 24px; font-size: 26px; }
  body.reader .corner-dots { display: none; }

  .draft-band {
    margin: 22px 0 0; border: 1px dashed var(--sanguine); color: var(--sanguine);
    font-family: var(--font-degraded); font-size: 13px; letter-spacing: .18em;
    text-transform: lowercase; padding: 6px 12px; display: inline-block;
  }

  .endmark { text-align: center; margin: 60px 0 0; color: var(--sanguine); font-size: 18px; }
  .art-nav { margin-top: 70px; border-top: 2px solid var(--ink); padding-top: 14px;
    display: flex; justify-content: space-between; font-family: var(--font-mono);
    font-size: 10px; letter-spacing: .18em; text-transform: lowercase; color: var(--ink-faint); }
  .art-nav a:hover { color: var(--sanguine); }
</style>
</head>
<body class="reader">
<div class="ground-mount" aria-label="page ground"></div>
<div class="corner-dots tl"></div>
<div class="corner-dots tr"></div>

<nav class="rail" id="rail" aria-label="studio contents">
  <a class="rail-mast" href="index.html" aria-label="back to the studio index"><div class="mast-title">
    <h1 id="mast-h1">studio</h1>
    <canvas id="masthead-canvas" data-word="studio" data-cap="58" aria-hidden="true"></canvas>
  </div></a>
</nav>

<div class="screens">
<div class="art-wrap">
  <nav class="site-nav" aria-label="site">
    <a class="home" href="../">con.rad</a>
    <a href="../writings/">writings</a>
    <a href="../collection/">collection</a>
    <a href="../projects/">projects</a>
    <a class="cur" href="index.html">studio</a>
  </nav>
  <nav class="furniture">
    <span><a href="../index.html">con.rad</a> &nbsp;/&nbsp; <a href="index.html">studio</a> &nbsp;/&nbsp; writings</span>
    <span class="right" id="furn-no">—</span>
  </nav>
  <main id="main"></main>
</div>
</div>

<script>
const IMG_V = "?v=1784771550";
(async function () {
  const main = document.getElementById("main");
  const slug = new URLSearchParams(location.search).get("a");
  let art, list;
  try {
    const [a, l] = await Promise.all([
      fetch(`data/articles/${encodeURIComponent(slug)}.json`, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }),
      fetch("data/articles.json", { cache: "no-store" }).then(r => r.json()),
    ]);
    art = a; list = l.articles || [];
  } catch (e) {
    main.innerHTML = `<div class="load-error">could not load article "${esc(slug)}" — ${e.message}.
      No embedded fallback; fix the fetch. <br /><br /><a href="index.html" style="text-decoration:underline">back to the studio →</a></div>`;
    return;
  }

  document.title = `${art.title} · STUDIO · Conrad House`;
  document.getElementById("furn-no").textContent = `n° ${art.no}`;

  // group consecutive text paragraphs into column blocks
  const blocks = [];
  let run = [];
  const flush = () => { if (run.length) { blocks.push(`<div class="cols">${run.join("")}</div>`); run = []; } };
  for (const b of art.body) {
    if (b.type === "p") run.push(`<p>${b.html}</p>`);
    else if (b.type === "drop") run.push(`<p class="drop">${b.html}</p>`);
    else {
      flush();
      if (b.type === "subhead") blocks.push(`<h2 class="a-subhead">${b.html}</h2>`);
      else if (b.type === "quote") blocks.push(`<blockquote class="a-quote"><p>${esc(b.text)}</p>${b.attribution ? `<footer>— ${esc(b.attribution)}</footer>` : ""}</blockquote>`);
      else if (b.type === "image") blocks.push(fig(b));
      else if (b.type === "pair") blocks.push(`<div class="a-pair">${(b.images || []).map(fig).join("")}</div>`);
      else if (b.type === "code") blocks.push(
        `<div class="a-code"><div class="bar"><span class="t">${esc(b.title || "code")}</span><span class="f">${esc(b.file || "")}</span></div>` +
        `<pre>${esc(b.code)}</pre>${b.caption ? `<div class="cap">${esc(b.caption)}</div>` : ""}</div>`);
    }
  }
  flush();

  const idx = list.findIndex(a => a.slug === art.slug);
  const prev = list[idx - 1], next = list[idx + 1];

  main.innerHTML = `
    <header class="art-head">
      <span class="date">${esc(art.date)}</span>
      <h1 data-drawn data-cap="76">${esc(art.title)}</h1>
      <div class="sub">${esc(art.subtitle)}</div>
      ${art.draft ? `<div class="draft-band">draft — awaiting conrad's edit</div>` : ""}
      ${art.work ? `<div style="margin-top:14px"><a href="piece.html?w=${encodeURIComponent(art.work)}" style="font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:lowercase;color:var(--sanguine)">→ the piece in the catalogue</a></div>` : ""}
    </header>
    <div class="art-body">${blocks.join("")}</div>
    <div class="endmark"><span data-die="64x18"></span></div>
    <nav class="art-nav">
      ${prev ? `<a href="article.html?a=${prev.slug}">← ${esc(prev.title)}</a>` : "<span></span>"}
      ${next ? `<a href="article.html?a=${next.slug}">${esc(next.title)} →</a>` : "<span></span>"}
    </nav>`;

  if (window.Graphite) Graphite.init(); else addEventListener("load", () => Graphite.init());
  if (window.Masthead) Masthead.init();
  if (window.Lightbox) Lightbox.attach();

  function fig(b) {
    return `<figure class="a-img"><div class="frame" data-lb data-lb-group="article" data-lb-caption="${esc(b.caption || "")}" data-lb-work="${esc(b.tag || "")}"><img src="${esc(b.src)}" alt="${esc(b.caption || "")}" loading="lazy" /></div>` +
      `<figcaption class="a-cap"><span>${esc(b.caption || "")}</span>${b.tag ? `<span class="tag">${esc(b.tag)}</span>` : ""}</figcaption></figure>`;
  }

  // reader-only. The spread survives as a private mockup mode for share
  // screenshots: open with ?spread=1 (no UI exposes it).
  if (new URLSearchParams(location.search).get("spread") === "1") {
    document.body.classList.remove("reader");
    document.body.classList.add("spread");
  }

  function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
})();
</script>
</body>
</html>
